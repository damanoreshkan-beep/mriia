name: verify

# The gate. The core arrives as the @microspec/core PACKAGE — `deno task install` materializes the file
# tree (npm-compat tarball) for /_rt serving, and every tool runs via its jsr: pin. One job per affected
# app on GitHub's fleet. The --minimum-dependency-age 0 in the tasks is deliberate: this farm consumes its
# own core minutes after publishing, inside the registry's default quarantine window.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.discover.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache deno deps (DENO_DIR, keyed on the lockfile)
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('deno.lock') }}
          restore-keys: deno-
      - name: The core, as a package
        # flagged, once: this farm consumes its own fresh publishes inside the registry's quarantine window
        run: deno install --minimum-dependency-age 0
      - name: The browser-free gate DAG (same floor as local)
        run: deno task gates
      - name: Discover apps to verify (affected-only, from the real import graph)
        id: discover
        run: |
          BEFORE="${{ github.event.before }}"
          RANGE=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}...${{ github.sha }}"
          fi
          if [ -z "$RANGE" ]; then
            echo "no usable diff base → whole farm"
            APPS=$(deno task --quiet affected --all)
          else
            echo "changed files:"; git diff --name-only "$RANGE" | sed 's/^/  /'
            APPS=$(git diff --name-only "$RANGE" | deno task --quiet affected)
          fi
          [ -z "$APPS" ] && APPS="[]"
          echo "verify matrix → $APPS"
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: unit
    if: ${{ needs.unit.outputs.apps != '[]' }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.unit.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache deno deps (DENO_DIR, keyed on the lockfile)
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('deno.lock') }}
          restore-keys: deno-
      - name: The core, as a package
        # flagged, once: this farm consumes its own fresh publishes inside the registry's quarantine window
        run: deno install --minimum-dependency-age 0
      - name: The generated shims (rt map + local importers)
        run: deno task rtmap
      - name: Verify ${{ matrix.app }}
        timeout-minutes: 4
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: deno task verify "$GITHUB_WORKSPACE/apps/${{ matrix.app }}" --shots
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shot-${{ matrix.app }}
          path: apps/${{ matrix.app }}/states/
          if-no-files-found: warn
