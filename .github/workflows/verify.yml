name: verify

# The gate — the shape the public farm always had (and the repo is public again, 2026-08-31): one Chromium
# job per affected app on GitHub's own fleet, ~20 in parallel, free. The framework is checked out at the
# pin in microspec.lock and linked in by setup.sh, so every gate runs exactly as it does locally.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.discover.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache deno deps (DENO_DIR, keyed on the lockfile)
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('deno.lock') }}
          restore-keys: deno-
      - name: Framework at the pin (microspec.lock)
        run: |
          PIN=$(cat microspec.lock)
          rm -rf microspec
          git clone --quiet https://github.com/damanoreshkan-beep/microspec microspec
          git -C microspec checkout --quiet "$PIN" || true
          ./setup.sh
      - name: The browser-free gate DAG (same floor as local)
        run: deno task gates
      - name: Discover apps to verify (affected-only, from the real import graph)
        id: discover
        run: |
          BEFORE="${{ github.event.before }}"
          RANGE=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}...${{ github.sha }}"
          fi
          if [ -z "$RANGE" ]; then
            echo "no usable diff base → whole farm"
            APPS=$(deno run -A tools/affected.mjs --all)
          else
            echo "changed files:"; git diff --name-only "$RANGE" | sed 's/^/  /'
            APPS=$(git diff --name-only "$RANGE" | deno run -A tools/affected.mjs)
          fi
          [ -z "$APPS" ] && APPS="[]"
          echo "verify matrix → $APPS"
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: unit
    if: ${{ needs.unit.outputs.apps != '[]' }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.unit.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache deno deps (DENO_DIR, keyed on the lockfile)
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('deno.lock') }}
          restore-keys: deno-
      - name: Framework at the pin
        run: |
          PIN=$(cat microspec.lock)
          rm -rf microspec
          git clone --quiet https://github.com/damanoreshkan-beep/microspec microspec
          git -C microspec checkout --quiet "$PIN" || true
          ./setup.sh
      - name: Verify ${{ matrix.app }}
        # Chrome is preinstalled on the hosted runner; headless — no Xvfb, no apt-get.
        timeout-minutes: 4
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: deno run -A packages/gates/verify.mjs "$GITHUB_WORKSPACE/apps/${{ matrix.app }}" --shots
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shot-${{ matrix.app }}
          path: apps/${{ matrix.app }}/states/
          if-no-files-found: warn
