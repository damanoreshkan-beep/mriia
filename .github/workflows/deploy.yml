name: deploy

# Ships dist/ to the box — Actions steps only, no infrastructure in the tree: host/user/path live in repo
# secrets, the key in VPS_DEPLOY_KEY. The core arrives as the @microspec/core package (deno task install);
# build + the dist-eye gate on the BUILT pages, then a restricted rsync and the public-URL probe. Gated on
# a green verify of main.
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: The core, as a package
        # flagged, once: this farm consumes its own fresh publishes inside the registry's quarantine window
        run: deno install --minimum-dependency-age 0
      - name: Assemble dist/
        run: deno task build
      - name: Digital Asset Links (Android App Links for the APK shells)
        # Writes dist/.well-known/assetlinks.json — one entry per installable app, so a tapped
        # mriia.si link opens the installed APK shell instead of the browser. Must ship in the
        # same dist/ the rsync below deploys (Android verifies it at install time).
        run: deno run --allow-read --allow-write tools/gen-assetlinks.mjs
      - name: The landing at "/" (the one indexed page), robots.txt, sitemap.xml, og.jpg
        # Replaces the build's redirect at dist/index.html with site/index.html filled from apps.json and the
        # store's captures (tools/site.mjs). The noindex on every other path is the web server's (edge web/nginx.conf).
        run: deno run --allow-read --allow-write tools/site.mjs dist
      - name: Eye on dist (real Chromium, measured)
        timeout-minutes: 20
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: deno task dist-eye --dist dist --out dist-eye
      - name: Upload dist shots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dist-eye
          path: dist-eye/
          retention-days: 14
      # What the store had already told people, read BEFORE the new files land: the announcement below is the
      # difference, so one entry is announced once, by the deploy that carried it.
      - name: The changelog as it is live
        run: deno run -A tools/announce.mjs --snapshot "$RUNNER_TEMP/changelog.live.json"
      - name: Ship dist/ (secrets only — no infrastructure in the tree)
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete --rsync-path="sudo rsync" -e "ssh -i ~/.ssh/deploy_key" dist/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
          sleep 2
          curl -fsS -o /dev/null https://mriia.si/store/
          test "$(curl -fsS https://mriia.si/_rt/build.js)" = "$(cat dist/_rt/build.js)"
      # Only a deploy that reached this line is announced: every step above has passed and the live site
      # answered with this build. A failed announcement never fails the deploy.
      - name: Tell the owner what changed for people (Telegram, the Mriia bot)
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: deno run -A tools/announce.mjs "$RUNNER_TEMP/changelog.live.json"
