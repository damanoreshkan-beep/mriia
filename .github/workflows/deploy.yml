name: deploy

# Ships dist/ to the box — entirely in Actions steps, no committed scripts, no infrastructure in the
# tree: host, user and path live in repo SECRETS (VPS_HOST / VPS_USER / VPS_PATH), the key in
# VPS_DEPLOY_KEY. Build on the hosted runner, the dist-eye gate on the BUILT pages, a restricted rsync,
# then the public-URL probe. Gated on a green verify of main.
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Framework at the pin
        run: |
          PIN=$(cat microspec.lock)
          rm -rf microspec
          git clone --quiet https://github.com/damanoreshkan-beep/microspec microspec
          git -C microspec checkout --quiet "$PIN" || true
          ./setup.sh
      - name: Assemble dist/
        run: deno run -A deploy/build.mjs
      - name: Eye on dist (real Chromium, measured)
        timeout-minutes: 20
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: deno run -A packages/gates/dist-eye.mjs --dist dist --out dist-eye
      - name: Upload dist shots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dist-eye
          path: dist-eye/
          retention-days: 14
      - name: Ship dist/ (secrets only — no infrastructure in the tree)
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete --rsync-path="sudo rsync" -e "ssh -i ~/.ssh/deploy_key" dist/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
          sleep 2
          curl -fsS -o /dev/null https://dreamstudio.mooo.com/store/
          test "$(curl -fsS https://dreamstudio.mooo.com/_rt/build.js)" = "$(cat dist/_rt/build.js)"
