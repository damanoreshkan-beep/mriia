name: deploy

# Ships dist/ to /srv/www on THIS host — the runner lives on the production VPS, so the deploy is a local
# rsync (no ssh secret, no network): the same restricted tree the old remote deploy wrote to, the same
# dist-eye gate before it, and the same public-URL verify after it. Gated on a green verify of main.
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, vps]
    timeout-minutes: 40
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
      - name: Framework at the pin
        run: |
          PIN=$(cat microspec.lock)
          rm -rf microspec
          git clone --quiet https://github.com/damanoreshkan-beep/microspec microspec
          git -C microspec checkout --quiet "$PIN" || true
          ./setup.sh
      - name: Toolchain on PATH
        run: echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Assemble dist/
        run: deno run -A deploy/build.mjs
      - name: Eye on dist (real Chromium, measured)
        timeout-minutes: 20
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: deno run -A packages/gates/dist-eye.mjs --dist dist --out dist-eye
      - name: Upload dist shots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dist-eye
          path: dist-eye/
          retention-days: 14
      - name: Ship dist/ to /srv/www (local — the runner IS the host)
        run: |
          set -euo pipefail
          sudo rsync -a --delete dist/ /srv/www/
          sleep 2
          curl -fsS -o /dev/null https://dreamstudio.mooo.com/store/
          test "$(curl -fsS https://dreamstudio.mooo.com/_rt/build.js)" = "$(cat dist/_rt/build.js)"
