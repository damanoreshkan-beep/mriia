<!DOCTYPE html>
<html lang="uk" data-theme="signal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Аванпости і станції</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <link href="/_rt/theme.css" rel="stylesheet" type="text/css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2",
      "lodash-es": "https://esm.sh/lodash-es@4.17.21",
      "three": "https://esm.sh/three@0.171.0",
      "three/addons/": "https://esm.sh/three@0.171.0/examples/jsm/",
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.20.1/dist/pixi.min.mjs",
      "pixi-filters": "https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.min.mjs",
      "d3-geo": "https://esm.sh/d3-geo@3",
      "topojson-client": "https://esm.sh/topojson-client@3",
      "@microspec/core/runtime/": "/_rt/"
    }
  }
  </script>
  <style>
    /* THE STATION'S LIGHT, in the theme's own pair: the nebula wash behind the console is the app's mark colours
       (--app-accent amber, --app-accent-2 cyan) at low alpha — never a fixed hue, so the wash follows a theme
       change and reads on paper as a warm cast. */
    .op-wash{background:radial-gradient(90% 60% at 25% 12%,color-mix(in srgb,var(--app-accent) 12%,transparent),transparent 55%),radial-gradient(80% 60% at 82% 78%,color-mix(in srgb,var(--app-accent-2, var(--color-accent)) 10%,transparent),transparent 55%)}
    /* THE CORE — the picked station is a FORM, not a stack of rings (owner 2026-10-09: «досить будувати
       квадратики, потрібні форми довільні»): its own shape (core shape.js), the theme's texture through it, a
       rim of light; the kit's form play button sits on it (both in one grid cell). Online lights the rim in the
       app's amber where the old glow was. Energy: at rest nothing moves; a station change is one ~320ms morph. */
    .op-core > *{grid-area:1/1}
    .op-orb{position:relative;width:min(12.5rem,58vw,30dvh);aspect-ratio:1}
    .op-fill{position:absolute;inset:0;background:var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat,var(--color-base-100)}
    /* the rim is the clip's path in an SVG over it, so the light can spill OUTSIDE the form */
    .op-rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
    .op-rim path{fill:none;vector-effect:non-scaling-stroke;transition:stroke var(--t-state) var(--ease-out),opacity var(--t-state) var(--ease-out)}
    .op-rim .e{stroke:var(--lm-rim-hi, color-mix(in oklch,var(--color-base-content) 30%,transparent));stroke-width:1.25}
    .op-rim .b1{stroke:var(--app-accent);stroke-width:12;opacity:0}
    .op-rim .b2{stroke:var(--app-accent);stroke-width:4;opacity:0}
    [data-op-state="online"] .op-rim .e{stroke:color-mix(in oklch,var(--app-accent) 85%,white)}
    [data-op-state="online"] .op-rim .b1{opacity:.07}
    [data-op-state="online"] .op-rim .b2{opacity:.22}
    /* paper: a glow on white is a smear — the online rim is the deep pole, no bloom */
    [data-theme="signal-light"] .op-rim .e{stroke:color-mix(in oklch,var(--color-base-content) 22%,transparent)}
    [data-theme="signal-light"] [data-op-state="online"] .op-rim .e{stroke:var(--color-secondary);stroke-width:1.75}
    [data-theme="signal-light"] .op-rim .b1,[data-theme="signal-light"] .op-rim .b2{display:none}
    /* the status LED breathes with the reactor — a state, not a loading spinner */
    .op-led[data-on]{background:var(--app-accent);animation:op-breathe 2.4s ease-in-out infinite}
    @keyframes op-breathe{0%,100%{opacity:1}50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.op-led[data-on]{animation:none}}
  </style>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Аванпости і станції</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>
  <script type="module">
    import spec from "./spec.json" with { type: "json" };
    import en from "./i18n/en.json" with { type: "json" };
    import uk from "./i18n/uk.json" with { type: "json" };
    import * as views from "./view.js";
    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
  </script>
</body>
</html>
