  <style>
    /* REMIX on the motion-and-free-forms system (owner 2026-10-11: «розповсюджувати нову дизайн систему»), after
       fonoteka and muzak. Each VERSION owns one of the farm's organic forms (core shape.js, seeded by the version);
       the one in the transport is the ORB — the theme's material through that form, its edge a rim of light — and
       it flows into the next version's form when the version changes. At rest the orb draws nothing. */
    .rx-orb { position: relative; width: min(13rem, 56vw, 28dvh); aspect-ratio: 1; margin-inline: auto; }
    .rx-fill { position: absolute; inset: 0; background: var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat, var(--color-base-100); }
    /* the rim: the same path as the clip, drawn in an SVG over it so the light can spill OUTSIDE the form */
    .rx-rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .rx-rim path { fill: none; vector-effect: non-scaling-stroke; transition: stroke var(--t-state) var(--ease-out), opacity var(--t-state) var(--ease-out); }
    .rx-rim .e { stroke: var(--lm-rim-hi); stroke-width: 1.25; }
    .rx-rim .b1 { stroke: var(--app-accent); stroke-width: 12; opacity: 0; }
    .rx-rim .b2 { stroke: var(--app-accent); stroke-width: 4; opacity: 0; }
    [data-playing="true"] .rx-rim .e { stroke: color-mix(in oklch, var(--app-accent) 85%, white); }
    [data-playing="true"] .rx-rim .b1 { opacity: .07; }
    [data-playing="true"] .rx-rim .b2 { opacity: .22; }
    /* paper: a glow on white is a smear — the playing rim is the deep pole, no bloom */
    [data-theme="signal-light"] .rx-rim .e { stroke: color-mix(in oklch, var(--color-base-content) 22%, transparent); }
    [data-theme="signal-light"] [data-playing="true"] .rx-rim .e { stroke: var(--color-secondary); stroke-width: 1.75; }
    [data-theme="signal-light"] .rx-rim .b1, [data-theme="signal-light"] .rx-rim .b2 { display: none; }

    /* The play button (a form that changes with the state) and the filament seek are the kit's —
       <Transport form>, core runtime.css .tp-form / .tp-filament. */

    /* the loop is ON («одна по колу»): the repeat-1 glyph in the app's light — the kit's lit state is the theme's
       primary, cream on black, which a phone does not tell from an unlit glyph (as in muzak and fonoteka) */
    #repeat[aria-pressed="true"] { color: var(--app-accent); filter: drop-shadow(0 0 6px var(--lm-bloom-hi)); }
    [data-theme="signal-light"] #repeat[aria-pressed="true"] { color: var(--color-secondary); filter: none; }

    /* THE STEPPER (view.js Stepper) — the transport's filament (core .tp-filament): a hairline, the six steps on it as
       their own forms, the stretch from 1× to the pick lit with a bloom, a transparent native range over it doing the
       work. --rx-k is the range thumb AND the node pitch's inset: the thumb's centre runs from k/2 to 100% − k/2,
       exactly where the nodes sit, so a finger on a node lands on that step. Declared on the wrapper: the caption row
       under the track places «1×» with it too. */
    .rx-stepper { --rx-k: 2.75rem; }
    .rx-st { position: relative; height: var(--ms-ctl); }
    .rx-st > i { position: absolute; top: 50%; pointer-events: none; }
    .rx-st-line { left: calc(var(--rx-k) / 2); right: calc(var(--rx-k) / 2); height: 1px; background: color-mix(in oklch, var(--color-base-content) 16%, transparent); }
    .rx-st-lit { height: 2px; margin-top: -.5px; border-radius: 2px; background: var(--app-accent); box-shadow: 0 0 10px var(--lm-bloom-hi, transparent);
      transition: left var(--t-state) var(--ease-out), width var(--t-state) var(--ease-out); }
    .rx-st-one { width: 1px; height: .875rem; margin: -.4375rem 0 0 -.5px; background: color-mix(in oklch, var(--color-base-content) 45%, transparent); }
    .rx-st-node { width: 1.125rem; height: 1.125rem; margin: -.5625rem 0 0 -.5625rem; transition: scale var(--t-state) var(--ease-out); }
    .rx-st-node svg { display: block; width: 100%; height: 100%; overflow: visible; }
    /* the fill is the panel's face, so the hairline does not run through a form */
    .rx-st-node path { fill: var(--color-base-100); stroke: color-mix(in oklch, var(--color-base-content) 45%, transparent); stroke-width: 1.25; vector-effect: non-scaling-stroke;
      transition: fill var(--t-state) var(--ease-out), stroke var(--t-state) var(--ease-out); }
    .rx-st-node[data-state="ready"] path { stroke: var(--app-accent); stroke-width: 1.75; }
    .rx-st-node[data-on] { scale: 1.6; }
    .rx-st-node[data-on] path { fill: var(--app-accent); stroke: var(--app-accent); }
    [data-theme="signal"] .rx-st-node[data-on] { filter: drop-shadow(0 0 6px var(--lm-bloom-hi)); }
    .rx-st > input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; -webkit-appearance: none; appearance: none; background: none; }
    .rx-st > input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: var(--rx-k); height: var(--rx-k); }
    .rx-st > input::-moz-range-thumb { width: var(--rx-k); height: var(--rx-k); border: 0; }
    .rx-st:has(> input:focus-visible) > .rx-st-node[data-on] { outline: 2px solid var(--color-base-content); outline-offset: 3px; border-radius: 50%; }
    /* paper: a glow on white is a smear — the deep pole lights the stretch and the pick */
    [data-theme="signal-light"] .rx-st-lit { background: var(--color-secondary); box-shadow: none; }
    [data-theme="signal-light"] .rx-st-node[data-state="ready"] path { stroke: var(--color-secondary); }
    [data-theme="signal-light"] .rx-st-node[data-on] path { fill: var(--color-secondary); stroke: var(--color-secondary); }
    @media (prefers-reduced-motion: reduce) { .rx-st-lit, .rx-st-node, .rx-st-node path { transition: none; } }
  </style>
