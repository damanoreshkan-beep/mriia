  <style>
    .sp-void{position:relative;container-type:size}
    .sp-stage{height:clamp(12rem,48dvh,34rem)}
    .sp-frame{position:relative;display:block;height:min(100cqh,calc(100cqw * 600 / 350));aspect-ratio:350/600;border-radius:var(--ms-r);overflow:hidden;line-height:0;
      transition:rotate var(--t-focal) var(--ease-in-out),filter var(--t-state) var(--ease-out),opacity var(--t-move) var(--ease-out),translate var(--t-move) var(--ease-out),scale var(--t-move) var(--ease-out)}
    @starting-style{.sp-frame{opacity:0;translate:0 10px;scale:.985}}
    .sp-art{display:block;width:100%;height:100%;object-fit:cover;transition:filter var(--t-state) var(--ease-out)}
    .sp-spirit{position:absolute;left:50%;top:50%;width:min(100cqw,90cqh);aspect-ratio:1;translate:-50% -50%;pointer-events:none}
    .sp-fill{position:absolute;inset:0;background:var(--ds-fill,var(--ds-scatter,none)) center / 125% auto no-repeat,var(--color-base-100)}
    
    .sp-rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .sp-rim path{fill:none;vector-effect:non-scaling-stroke;transition:stroke var(--t-state) var(--ease-out),opacity var(--t-state) var(--ease-out)}
    .sp-rim .e{stroke:var(--lm-rim-hi);stroke-width:1.25}
    .sp-rim .b{stroke:var(--app-accent);stroke-width:5;opacity:0}
    [data-spoken="true"] .sp-rim .e{stroke:color-mix(in oklch,var(--app-accent) 85%,white)}
    [data-spoken="true"] .sp-rim .b{opacity:.22}
    
    [data-theme="signal-light"] .sp-rim .e{stroke:color-mix(in oklch,var(--color-base-content) 22%,transparent)}
    [data-theme="signal-light"] [data-spoken="true"] .sp-rim .e{stroke:var(--color-secondary);stroke-width:1.75}
    [data-theme="signal-light"] .sp-rim .b{display:none}
    .sp-frame::before{content:"";position:absolute;inset:0;pointer-events:none;background:color-mix(in oklch,var(--app-accent) 14%,transparent);mix-blend-mode:soft-light}
    .sp-frame::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--ds-grain,none);background-size:220px 220px;mix-blend-mode:multiply;opacity:.55}
    html[data-material="paper"] .sp-art{filter:sepia(.32) contrast(.94) saturate(.9)}
    html[data-material="ink"] .sp-art{filter:grayscale(.8) contrast(1.16)}
    html[data-material="mercury"] .sp-art{filter:saturate(.4) contrast(1.06) brightness(1.04)}
    html[data-material="smoke"] .sp-art{filter:saturate(.55) contrast(.96) brightness(.9)}
    html[data-material="thread"] .sp-art{filter:sepia(.2) saturate(1.05) contrast(1.03)}
    html[data-material="circuit"] .sp-art{filter:saturate(.75) contrast(1.1) hue-rotate(12deg)}
    html[data-material="veil"] .sp-art{filter:saturate(1.1) hue-rotate(-10deg) brightness(1.02)}
    html[data-material="ferro"] .sp-art{filter:saturate(.45) contrast(1.15) hue-rotate(20deg)}
    html[data-material="porcelain"] .sp-art{filter:saturate(.8) contrast(.9) brightness(1.06)}
    html[data-material="sand"] .sp-art{filter:sepia(.42) saturate(.95) contrast(.97)}
    html[data-material="plain"] .sp-frame::before{display:none}
    
    .sp-caret{display:inline-block;width:2px;height:1em;vertical-align:-.12em;background:var(--app-accent);animation:sp-blink 1s steps(2) infinite}
    @keyframes sp-blink{to{opacity:0}}
    @media(prefers-reduced-motion:reduce){.sp-frame,.sp-art,.sp-rim path{transition:none}.sp-caret{animation:none}}
  </style>
