  <style>
    /* MUZAK — a player, not a downloader (owner 2026-10-11: «музак має бути плеєр як у фонотеці», the download
       button gone). The playing song is its COVER seen through the song's own form (core shape.js, seeded by its
       id), flowing into the next song's form when the song changes; its edge a rim of light — fonoteka's orb, with
       the song's own picture as the material. Before any song: the theme's fill through an idle form. */
    .mz-orb { position: relative; width: min(15rem, 62vw, 30dvh); aspect-ratio: 1; margin-inline: auto; }
    .mz-fill { position: absolute; inset: 0; background: var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat, var(--color-base-100); }
    .mz-fill img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .mz-rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .mz-rim path { fill: none; vector-effect: non-scaling-stroke; transition: stroke var(--t-state) var(--ease-out), opacity var(--t-state) var(--ease-out); }
    .mz-rim .e { stroke: var(--lm-rim-hi); stroke-width: 1.25; }
    .mz-rim .b1 { stroke: var(--app-accent); stroke-width: 12; opacity: 0; }
    .mz-rim .b2 { stroke: var(--app-accent); stroke-width: 4; opacity: 0; }
    [data-playing="true"] .mz-rim .e { stroke: color-mix(in oklch, var(--app-accent) 85%, white); }
    [data-playing="true"] .mz-rim .b1 { opacity: .07; }
    [data-playing="true"] .mz-rim .b2 { opacity: .22; }
    /* paper: a glow on white is a smear — the playing rim is the deep pole, no bloom */
    [data-theme="signal-light"] .mz-rim .e { stroke: color-mix(in oklch, var(--color-base-content) 22%, transparent); }
    [data-theme="signal-light"] [data-playing="true"] .mz-rim .e { stroke: var(--color-secondary); stroke-width: 1.75; }
    [data-theme="signal-light"] .mz-rim .b1, [data-theme="signal-light"] .mz-rim .b2 { display: none; }
    /* the song being made playable on the edge (a first listen waits a few seconds): the form breathes slowly */
    [data-loading="true"] .mz-orb { animation: mz-wait 1.6s var(--ease-out) infinite alternate; }
    @keyframes mz-wait { to { opacity: .55; } }

    /* a row's cover: the song's picture, the playing one ringed in the accent */
    .mz-cover { position: relative; width: 3rem; height: 3rem; flex: none; border-radius: var(--ms-r-in); overflow: hidden; }
    [aria-pressed="true"] .mz-cover { box-shadow: 0 0 0 2px var(--app-accent); }
    [data-theme="signal"] [aria-pressed="true"] .mz-cover { box-shadow: 0 0 0 2px var(--app-accent), 0 0 14px var(--lm-bloom-hi); }
    [data-theme="signal-light"] [aria-pressed="true"] .mz-cover { box-shadow: 0 0 0 2px var(--color-secondary); }

    /* a new row arrives instead of appearing (entry only — a list re-render never replays it) */
    .mz-row { transition: opacity var(--t-state) var(--ease-out), translate var(--t-state) var(--ease-out); }
    @starting-style { .mz-row { opacity: 0; translate: 0 6px; } }
    @media (prefers-reduced-motion: reduce) {
      .mz-row { transition: none; }
      [data-loading="true"] .mz-orb { animation: none; }
    }
  </style>
