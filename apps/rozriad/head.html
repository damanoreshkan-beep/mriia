  <style>
    /* ROZRIAD — the touch surface and the terminal HUD. The field under it is the core's GlStage; this file
       owns only what sits on top. */
    .rz-field { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    /* The HUD is a black terminal in both themes (the brief): mono, black glass over the field, a cyan rim.
       It is READ, never pressed — pointer-events pass through it to the field. */
    .rz-hud { font-family: var(--font-mono); font-size: var(--ms-label); line-height: 1.5; letter-spacing: .02em; font-variant-numeric: tabular-nums;
      color: #D9EDEA; background: rgba(0, 0, 0, .68); border: 1px solid rgba(92, 228, 220, .32); border-radius: calc(var(--ms-r) * .55);
      padding: calc(var(--ms-pad) * .55) calc(var(--ms-pad) * .8); margin: 0; white-space: pre; width: max-content; max-width: 100%; overflow: hidden;
      pointer-events: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .rz-hud b { color: #5CE4DC; font-weight: 600; }
    .rz-hud i { color: #F2B84B; font-style: normal; }
    [data-theme="signal-light"] .rz-hud { background: rgba(0, 0, 0, .8); border-color: rgba(92, 228, 220, .45); }
    /* the empty state when the browser has no WebGL2: the kit's words, centred in the void */
    .rz-nogl { color: var(--color-base-content); }
  </style>
