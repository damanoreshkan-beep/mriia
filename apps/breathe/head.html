  <style>
    .br-orb{position:relative}
    .br-fill{position:absolute;inset:0;background:var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat,var(--color-base-100)}
    .br-rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
    .br-rim path{fill:none;vector-effect:non-scaling-stroke;transition:stroke var(--t-state) var(--ease-out),opacity var(--t-state) var(--ease-out)}
    .br-rim .e{stroke:var(--lm-rim-hi, color-mix(in oklch,var(--color-base-content) 30%,transparent));stroke-width:1.25}
    .br-rim .b1{stroke:var(--app-accent);stroke-width:12;opacity:0}

    [data-breathe][data-playing="1"] .br-rim .e{stroke:color-mix(in oklch,var(--app-accent) 85%,white)}

    [data-breathe][data-playing="1"] .br-rim .b2{opacity:.22}
    
    [data-theme="signal-light"] .br-rim .e{stroke:color-mix(in oklch,var(--color-base-content) 22%,transparent)}

  </style>
