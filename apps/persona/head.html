  <style>
    /* PERSONA on the motion-and-free-forms system (owner 2026-10-11: «розповсюджувати нову дизайн систему»), after
       fonoteka and muzak. The PERSON is the identity: the portrait is seen through the person's own organic form
       (core shape.js, seeded by the slug — view.js Portrait), its edge a rim of light. While the persona's voice
       speaks the rim lights in the accent, as a playing song's orb does; at rest the portrait draws nothing. */
    .pn-face { position: relative; flex: none; }
    /* a zero-size svg, not display:none — a clipPath inside a display:none svg does not clip in every engine */
    .pn-defs { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }
    /* the theme's material under the picture, seen only while the portrait loads */
    .pn-art { position: absolute; inset: 0; background: var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat, var(--color-base-100); }
    .pn-art img { display: block; width: 100%; height: 100%; object-fit: cover; }
    /* the rim: the same path as the clip, drawn in an SVG over it so the light can spill OUTSIDE the form. One
       bloom stroke, not the orb's two: at 2.5–4.5rem a 12px bloom would swallow the form. */
    .pn-rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .pn-rim path { fill: none; vector-effect: non-scaling-stroke; transition: stroke var(--t-state) var(--ease-out), opacity var(--t-state) var(--ease-out); }
    .pn-rim .e { stroke: var(--lm-rim-hi); stroke-width: 1.25; }
    .pn-rim .b { stroke: var(--app-accent); stroke-width: 5; opacity: 0; }
    [data-speaking="true"] .pn-rim .e { stroke: color-mix(in oklch, var(--app-accent) 85%, white); }
    [data-speaking="true"] .pn-rim .b { opacity: .22; }
    /* paper: a glow on white is a smear — the speaking rim is the deep pole, no bloom */
    [data-theme="signal-light"] .pn-rim .e { stroke: color-mix(in oklch, var(--color-base-content) 22%, transparent); }
    [data-theme="signal-light"] [data-speaking="true"] .pn-rim .e { stroke: var(--color-secondary); stroke-width: 1.75; }
    [data-theme="signal-light"] .pn-rim .b { display: none; }
  </style>
