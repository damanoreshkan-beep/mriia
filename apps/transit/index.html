<!DOCTYPE html>

<head>

  <meta name="theme-color" content="#000000">
  <title>Транзити</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2",
      "lodash-es": "https://esm.sh/lodash-es@4.17.21",
      "three": "https://esm.sh/three@0.171.0",
      "three/addons/": "https://esm.sh/three@0.171.0/examples/jsm/",
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.20.1/dist/pixi.min.mjs",
      "pixi-filters": "https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.min.mjs",
      "d3-geo": "https://esm.sh/d3-geo@3",
      "topojson-client": "https://esm.sh/topojson-client@3",
      "@microspec/core/runtime/": "/_rt/"
    }
  }
  </script>
  <style>
    /* TRANSIT on the motion-and-free-forms system (owner 2026-10-11: «розповсюджувати нову дизайн систему»). The
       wheel, the tables and the times are the instrument and stay plain. Two objects take a form: the PERSON whose
       chart it is (an orb on the birth row and on each match card, seeded by the birth date) and each transiting
       PLANET (its own form in its own colour on the wheel's contacts and on the moments). Energy: at rest nothing
       moves; a new birth date is one morph. */

    /* THE ORB — spans, not divs, since it lives in a <button> */
    .tr-orb { position: relative; display: block; flex: none; width: 3rem; aspect-ratio: 1; }
    .tr-orb-lg { width: 3.75rem; }
    /* the theme's MATERIAL through the form (its fill texture, falling back to its scatter), over the page tone */
    .tr-fill { position: absolute; inset: 0; background: var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat, var(--color-base-100); }
    /* the rim: the same path as the clip, in an SVG over it so the light can spill OUTSIDE the form. One thin bloom:
       at 3rem a wide one would swallow the form. Always lit — the person is the chart's owner. */
    .tr-rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .tr-rim path { fill: none; vector-effect: non-scaling-stroke; }
    .tr-rim .e { stroke: color-mix(in oklch, var(--app-accent) 85%, white); stroke-width: 1.25; }
    .tr-rim .b { stroke: var(--app-accent); stroke-width: 4; opacity: .2; }
    /* the Sun's sign sits on the texture: a halo in the page tone keeps it legible over any theme's material */
    .tr-sign { position: absolute; inset: 25%; width: 50%; height: 50%; color: var(--app-accent); filter: drop-shadow(0 0 3px var(--color-base-100)); }
    /* paper: a glow on white is a smear — the rim and the sign are the deep pole, no bloom */
    [data-theme="signal-light"] .tr-rim .e { stroke: var(--color-secondary); stroke-width: 1.75; }
    [data-theme="signal-light"] .tr-rim .b { display: none; }
    [data-theme="signal-light"] .tr-sign { color: var(--color-secondary); }

    /* A PLANET — its form in its own colour; a hairline edge keeps the pale ones (Moon, Venus) on paper. An EXACT
       contact (the one whose degrees the app already prints in the primary) lights the edge. */
    /* sized to the rows they sit in: a contact row is already full to the edge on a phone, so the form takes only
       a few px more than a dot would */
    .tr-body { flex: none; width: 1.125rem; height: 1.125rem; overflow: visible; }
    .tr-body-lg { width: 1.5rem; height: 1.5rem; }
    .tr-body path { fill: var(--body); stroke: color-mix(in oklch, var(--color-base-content) 28%, transparent); stroke-width: 1; vector-effect: non-scaling-stroke; }
    [data-exact="true"] .tr-body path { stroke: var(--app-accent); stroke-width: 1.5; }
    [data-theme="signal"] [data-exact="true"] .tr-body { filter: drop-shadow(0 0 5px var(--lm-bloom-hi)); }
    [data-theme="signal-light"] [data-exact="true"] .tr-body path { stroke: var(--color-secondary); }
  </style>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Транзити</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>
  <script type="module">
    import spec from "./spec.json" with { type: "json" };
    import en from "./i18n/en.json" with { type: "json" };
    import uk from "./i18n/uk.json" with { type: "json" };
    import * as views from "./view.js";
    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
  </script>
</body>
</html>
