<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Хендпан</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2",
      "lodash-es": "https://esm.sh/lodash-es@4.17.21",
      "three": "https://esm.sh/three@0.171.0",
      "three/addons/": "https://esm.sh/three@0.171.0/examples/jsm/",
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.20.1/dist/pixi.min.mjs",
      "pixi-filters": "https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.min.mjs",
      "d3-geo": "https://esm.sh/d3-geo@3",
      "topojson-client": "https://esm.sh/topojson-client@3",
      "@microspec/core/runtime/": "/_rt/"
    }
  }
  </script>
  <style>
    /* Realistic tone fields — dark nitrided-steel domes/dimples that catch a specular glint following a light
       whose direction (--lx/--ly, set on the pan by the gyroscope) shifts as you tilt the phone. Real DOM
       buttons (accessible, hit-testable); the 3D is pure light-reactive CSS. See RESEARCH-buttons.md.
       THE STEEL IS A DEPICTED MATERIAL, like a photo: nitrided steel is dark in any room, so its greys, the
       white of the light landing on it and the black of its shade are literal by design and do not follow the
       theme — only the pan's shell around it does. The ring a struck field glows with is the app's MARK
       colour (--app-accent), the one theme token a light source may carry. */
    /* Outer fields are CONCAVE dimples: a raised rim (bright toward the light, shadowed away) around a sunken
       dish, so the shading is INVERTED vs the convex ding — the rim glint sits toward the light, the dish
       shadow opposite. The specular is a ring on the rim, not a centre hotspot. */
    .hp-field{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;
      border:0;padding:0;cursor:pointer;appearance:none;-webkit-tap-highlight-color:transparent;--glow:var(--app-accent);
      background:radial-gradient(circle at calc(50% - var(--lx,0)*22%) calc(50% - var(--ly,0)*22%),#141519 0%,#1d1e23 52%,#2a2b32 84%,#303138 100%);
      box-shadow:
        calc(var(--lx,0)*-2px) calc(var(--ly,0)*-2px + 2px) 6px -1px rgba(0,0,0,.55),
        inset calc(var(--lx,0)*3px) calc(var(--ly,0)*3px) 5px rgba(0,0,0,.66),
        inset calc(var(--lx,0)*-2.4px) calc(var(--ly,0)*-2.4px) 2px rgba(255,255,255,.16),
        0 0 0 1px rgba(0,0,0,.4);
      transition:filter var(--t-state) var(--ease-out);}
    .hp-field::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
      background:radial-gradient(circle at calc(50% - var(--lx,0)*34%) calc(50% - var(--ly,0)*34%),
        rgba(255,255,255,.34) 0%,rgba(255,255,255,.06) 13%,transparent 30%);}
    .hp-ding{background:radial-gradient(circle at 50% 40%,#34353c 0%,#212228 58%,#131418 100%);
      box-shadow:
        calc(var(--lx,0)*-4px) calc(var(--ly,0)*-4px + 5px) 15px -2px rgba(0,0,0,.72),
        inset calc(var(--lx,0)*2px) calc(var(--ly,0)*2px) 3px rgba(255,255,255,.2),
        inset calc(var(--lx,0)*-3px) calc(var(--ly,0)*-3px) 9px rgba(0,0,0,.5),
        0 0 0 1px rgba(0,0,0,.5);}
    .hp-ding::after{background:radial-gradient(circle at calc(50% + var(--lx,0)*26%) calc(40% + var(--ly,0)*24%),
        rgba(255,255,255,.55) 0%,rgba(255,255,255,.12) 16%,transparent 42%);}
    .hp-lbl{position:relative;z-index:1;pointer-events:none;font-weight:600;color:rgba(236,236,238,.82);
      font-size:clamp(.62rem,2.5vw,.95rem);text-shadow:0 1px 1px rgba(0,0,0,.55);}
    .hp-lit{animation:hp-press var(--t-state) var(--ease-out);
      filter:drop-shadow(0 0 5px var(--glow)) drop-shadow(0 0 2px var(--glow)) brightness(1.14);}
    @keyframes hp-press{0%{transform:translate(-50%,-50%) scale(1)}34%{transform:translate(-50%,-50%) scale(.85)}100%{transform:translate(-50%,-50%) scale(1)}}
    @media(prefers-reduced-motion:reduce){.hp-lit{animation:none}}
    /* SAVED LOOP — onto the farm's free forms (owner 2026-10-11: «розповсюджувати нову дизайн систему»). The pan
       itself stays the round steel instrument — it is the playable surface, not a decoration. A SAVED LOOP'S play
       key is the loop's own form (core shape.js, seeded by its id) in place of a circle: ink at rest, the
       secondary while that loop is the one playing — the colours the circle had. A static path: nothing draws
       at rest. */
    .hp-loop{position:relative;display:grid;place-items:center;width:2.25rem;height:2.25rem;flex:none;color:var(--color-primary-content);}
    .hp-loop::before{content:"";position:absolute;inset:-.25rem;}/* 36px form, 44px finger target; the card's p-3/gap-3 leave room */
    .hp-loop > svg{position:absolute;inset:0;width:100%;height:100%;}
    .hp-loop > svg path{fill:var(--color-primary);transition:fill var(--t-state) var(--ease-out);}
    .hp-loop > iconify-icon{position:relative;}
    .hp-loop[data-on="true"]{color:var(--color-secondary-content);}
    .hp-loop[data-on="true"] > svg path{fill:var(--color-secondary);}
    .hp-loop:focus-visible{outline:2px solid var(--color-base-content);outline-offset:3px;border-radius:50%;}
  </style>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Хендпан</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>
  <script type="module">
    import spec from "./spec.json" with { type: "json" };
    import en from "./i18n/en.json" with { type: "json" };
    import uk from "./i18n/uk.json" with { type: "json" };
    import * as views from "./view.js";
    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
  </script>
</body>
</html>
