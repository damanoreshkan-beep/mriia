  <style>
    /* The picture layers: two slots cross-fade (opacity only — the compositor takes it), and the one on
       carries a slow drift over the whole display period. 108 % oversize so the drift never shows an edge;
       the two slots drift in opposite directions so consecutive frames never move the same way. */
    /* The layer is EXACTLY the stage box (inset 0, 100%): the drift's headroom lives in the TRANSFORM alone
       (a resting scale(1.08) = 4% margin each side), so whatever happens to the animation — reduced motion,
       a dropped keyframe, the fullscreen top layer's UA rules — the picture still covers edge to edge and
       stays centred. The negative-inset + oversize box it replaces left a bar when its percentages resolved
       oddly in real fullscreen (owner's phone, 2026-09-01). */
    .vy-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;opacity:0;transition:opacity 1.6s ease;will-change:opacity,transform;transform-origin:50% 50%;transform:scale(1.08)}
    .vy-layer[data-on]{opacity:1;animation:vy-drift var(--vy-every,120s) linear forwards}
    .vy-layer[data-slot="1"][data-on]{animation-name:vy-drift-b}
    @keyframes vy-drift{from{transform:scale(1.08)}to{transform:scale(1.14) translate(-1.3%,.9%)}}
    @keyframes vy-drift-b{from{transform:scale(1.14) translate(1.1%,-.7%)}to{transform:scale(1.08)}}
    .vy-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 38%,transparent 58%,rgba(0,0,0,.42))}
    /* The show's words: a scrim rising from the foot, white ink with a soft cast — legible over any frame */
    .vy-type{position:absolute;left:0;right:0;bottom:0;pointer-events:none;color:#fff;padding:30vh clamp(1.25rem,6vw,3rem) calc(env(safe-area-inset-bottom) + clamp(1.5rem,7vh,4rem));text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 24px rgba(0,0,0,.35);background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,.28) 50%,transparent)}
    .vy-clock{font-family:var(--font-mono);font-weight:500;font-size:clamp(3.2rem,15vw,7rem);line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
    .vy-date{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.14em;font-size:clamp(.7rem,2.6vw,.85rem);opacity:.78;margin-top:.6rem}
    .vy-line{font-weight:500;font-size:clamp(1.05rem,4.4vw,1.5rem);line-height:1.3;max-width:30ch;margin-top:clamp(1rem,4vh,2rem);text-wrap:balance}
    .vy-caption{font-family:var(--font-mono);font-size:.72rem;opacity:.55;margin-top:.6rem;max-width:44ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vy-stage:fullscreen,.vy-stage:-webkit-full-screen{width:100vw;height:100vh}
    .vy-stage::backdrop{background:#000}
    @media(prefers-reduced-motion:reduce){.vy-layer[data-on]{animation:none}}
    /* the waiting field: the veiled stage hides its picture layers; the ambient texture breathes slowly.
       The field FADES IN over the retiring picture (a theme change must read as a soft hand-off, never a
       cut to black) — the layers below take their own 1.6s opacity transition out. */
    .vy-stage[data-veil] .vy-layer{opacity:0;animation:none}
    [data-veiled]{animation:vy-veilin .8s ease both}
    @keyframes vy-veilin{from{opacity:0}to{opacity:1}}
    .vy-amb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:vy-breathe 26s ease-in-out infinite alternate}
    @keyframes vy-breathe{from{transform:scale(1.03)}to{transform:scale(1.1)}}
    /* the island's status line: each state ENTERS (a soft rise, replayed on remount — the countdown is
       keyed once so ticking seconds do not re-run it), and the working state breathes through three
       staggered dots — a typographic pulse, never a spinner */
    .vy-st{animation:vy-stin var(--t-state) var(--ease-out)}
    @keyframes vy-stin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
    .vy-dots span{display:inline-block;animation:vy-dot 1.2s ease-in-out infinite;opacity:.2}
    .vy-dots span:nth-child(2){animation-delay:.2s}
    .vy-dots span:nth-child(3){animation-delay:.4s}
    @keyframes vy-dot{0%,60%,100%{opacity:.2}30%{opacity:1}}
    /* text arrives as a wave — one beat per character, capped so long lines land within a second;
       words stay whole (.vy-w) so the wave never invents a mid-word break */
    .vy-w{display:inline-block;white-space:nowrap}
    .vy-ch{display:inline-block;opacity:0;animation:vy-ch var(--t-focal) var(--ease-out) forwards;animation-delay:min(calc(var(--ci)*.035s),.9s)}
    @keyframes vy-ch{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.vy-ch{animation-duration:.01s;animation-delay:0s}.vy-amb{animation:none}[data-veiled]{animation:none}.vy-st{animation:none}.vy-dots span{animation:none;opacity:.6}}
    /* THE CHARACTERS (owner 2026-09-04: "окремий вибір персонажів мікрокартинками … сіткою, тикаємо і відкривається
       на весь екран"): a grid of square micro-pictures over the living stage, one per character in the phone's
       mode; a tap opens the show. Tiles arrive on the kit's stagger (.ms-stagger) and give on the press (.ms-press).
       Owner 2026-10-11 («розповсюджувати нову дизайн систему»): each picture is seen through the character's own form
       (view.js CharGrid), the name under it; the chosen one's rim is lit where the accent ring stood. */
    .vy-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(.5rem,2.2vw,.8rem)}
    @media(min-width:640px){.vy-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(min-width:900px){.vy-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
    /* a tiny screen (a 300×300 widget, a split pane): the grid becomes ONE horizontal strip of fixed tiles that
       snaps, and the strip contains its own axis only — a vertical swipe that starts on it still scrolls the
       page (the kit's rule for .overflow-x-auto, owner 2026-09-04: "не можу скролити сторінку вниз") */
    @media(max-height:480px),(max-width:340px){
      .vy-grid{display:flex;align-items:flex-start;gap:.5rem;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;overscroll-behavior-y:auto;scrollbar-width:none;margin:0 calc(-1*var(--ms-pad));padding:0 var(--ms-pad) .25rem}
      .vy-grid::-webkit-scrollbar{display:none}
      /* a fixed width and the form square by its own aspect ratio; the name sits under it, so the tile's height is
         the form plus one line — never set, so it cannot stretch */
      .vy-grid>.vy-tile{flex:0 0 auto;width:clamp(76px,26vmin,112px);scroll-snap-align:start}
      .vy-grid>.vy-tile .vy-form{width:100%}
      .vy-grid>.vy-tile .vy-name{font-size:.62rem}
      .vy-grid>.vy-tile .vy-side{display:none}
    }
    .vy-forms{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
    .vy-tile{display:flex;flex-direction:column;align-items:center;gap:.35rem;width:100%;min-width:0;text-align:center;-webkit-tap-highlight-color:transparent}
    /* the form is a touch narrower than its cell, so twelve named forms still sit over the stage on a phone */
    .vy-form{position:relative;display:block;width:88%;aspect-ratio:1;flex:none}
    /* the theme's material under the picture, seen only while it loads (or if it fails) */
    .vy-art{position:absolute;inset:0;background:var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat, var(--color-base-100)}
    .vy-art img{display:block;width:100%;height:100%;object-fit:cover}
    /* the rim: the clip's path drawn in an SVG over it, so the light sits ON the edge — on true black it is what
       draws a night picture's form at all; on paper the form draws itself and the rim stays faint */
    .vy-rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
    .vy-rim use{fill:none;stroke:var(--lm-rim-hi);stroke-width:1;transition:stroke var(--t-press) var(--ease-out),stroke-width var(--t-state) var(--ease-out)}
    [data-theme="signal-light"] .vy-rim use{stroke:color-mix(in oklch, var(--color-base-content) 22%, transparent)}
    /* a touch lights the rim in the accent (the give itself is .ms-press); the chosen one keeps it lit */
    .vy-tile:active .vy-rim use{stroke:var(--app-accent)}
    .vy-tile[data-on] .vy-rim use{stroke:color-mix(in oklch, var(--app-accent) 85%, white);stroke-width:1.75}
    [data-theme="signal"] .vy-tile[data-on] .vy-rim{filter:drop-shadow(0 0 6px var(--lm-bloom-hi))}
    /* paper: a glow on white is a smear — the pressed and the chosen rim are the deep pole, no bloom */
    [data-theme="signal-light"] .vy-tile:active .vy-rim use,[data-theme="signal-light"] .vy-tile[data-on] .vy-rim use{stroke:var(--color-secondary)}
    /* the name stands on the living stage, not on a scrim: the theme's ink with a cast of the theme's ground, so it
       reads over any frame in both modes (night: light ink on a black cast; day: dark ink on a paper cast) */
    .vy-name{display:block;max-width:100%;color:var(--color-base-content);font-size:.72rem;line-height:1.15;font-weight:500;text-shadow:0 1px 2px var(--color-base-100),0 0 10px var(--color-base-100);overflow-wrap:break-word}
    .vy-side{display:block;font-family:var(--font-mono);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-top:.15rem}
    .vy-tile[data-on] .vy-name{font-weight:600}
  </style>
