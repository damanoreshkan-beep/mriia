  <style>
    /* THE CURRENT'S COLOUR — a MARK (the dots on the strip, under the transport's title, in the station
       picker). The hue is the current's own DATA (rt/tide.js gives each current a hue); how vivid and how
       light it is belongs to the THEME: a 58 %-light hue reads on black, and on paper it deepens so the dot
       stays a mark rather than a pastel smear. The view writes only `--tide-hue` on its root; the colour is
       composed here, so it flips with the theme instead of being fixed by JS at render. The farm's
       --app-accent is never written per app (rt/theme-lum.css) — the current no longer overrides it. */
    :root{--tide-s:60%;--tide-l:58%}
    [data-theme="signal-light"]{--tide-s:55%;--tide-l:40%}
    .tide-dot{background:hsl(var(--tide-hue) var(--tide-s) var(--tide-l))}
    /* A STATION'S GLYPH in the picker — its own form (core shape.js, seeded by its id), small: a faint outline
       at rest, filled with the current's colour when it is the one on air (the same mark the dot was). */
    .tide-glyph{width:1.25rem;height:1.25rem;flex:none;overflow:visible}
    .tide-glyph path{fill:none;stroke:color-mix(in oklch,var(--color-base-content) 38%,transparent);stroke-width:1.25;vector-effect:non-scaling-stroke;transition:fill var(--t-state) var(--ease-out),stroke var(--t-state) var(--ease-out)}
    [aria-pressed="true"] .tide-glyph path{fill:hsl(var(--tide-hue) var(--tide-s) var(--tide-l));stroke:hsl(var(--tide-hue) var(--tide-s) var(--tide-l))}
  </style>
