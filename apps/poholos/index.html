<!DOCTYPE html>
<html lang="uk" data-theme="signal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Поголос</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <link href="/_rt/theme.css" rel="stylesheet" type="text/css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2",
      "lodash-es": "https://esm.sh/lodash-es@4.17.21",
      "three": "https://esm.sh/three@0.171.0",
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.20.1/dist/pixi.min.mjs",
      "pixi-filters": "https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.min.mjs",
      "d3-geo": "https://esm.sh/d3-geo@3",
      "topojson-client": "https://esm.sh/topojson-client@3",
      "@microspec/core/runtime/": "/_rt/"
    }
  }
  </script>
  <style>
    .ph-wrap{display:flex;flex-direction:column;gap:calc(var(--ms-gap)*.75);min-height:0;
      height:calc(100svh - var(--hdr-h,56px) - var(--dock-h,64px) - var(--ms-pad,1rem)*2)}

    
    .ph-near{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--ms-mono,ui-monospace,monospace);
      font-size:var(--ms-label);letter-spacing:.03em;line-height:1}
    .ph-dot{width:.5rem;height:.5rem;border-radius:999px;background:var(--app-accent);flex:none;
      box-shadow:0 0 .5rem color-mix(in oklch,var(--app-accent) 70%,transparent);animation:ph-pulse 2.4s ease-out infinite}
    
    .ph-dot[data-alone="1"]{background:color-mix(in oklch,var(--base-content,currentColor) 35%,transparent);animation:none;box-shadow:none}
    @keyframes ph-pulse{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--app-accent) 55%,transparent)}70%{box-shadow:0 0 0 .55rem transparent}100%{box-shadow:0 0 0 0 transparent}}
    @media (prefers-reduced-motion:reduce){.ph-dot{animation:none}}
    .ph-near-sub{opacity:.6}
    
    .ph-feed{display:flex;flex-direction:column;gap:.28rem;overflow-y:auto;min-height:0;flex:1;
      padding:.2rem .1rem;scrollbar-width:none}
    .ph-feed::-webkit-scrollbar{display:none}
    .ph-row{display:flex;max-width:100%}
    .ph-row[data-mine="1"]{justify-content:flex-end}
    .ph-row[data-first="1"]{margin-top:.5rem}

    
    .ph-bubble{position:relative;max-width:80%;padding:.5rem .75rem .4rem;line-height:1.4;
      border-radius:1.15rem 1.15rem 1.15rem .4rem;
      background:color-mix(in oklch,var(--base-content,currentColor) 7%,transparent);
      box-shadow:0 1px 0 color-mix(in oklch,var(--base-content,currentColor) 5%,transparent)}
    .ph-row[data-mine="1"] .ph-bubble{border-radius:1.15rem 1.15rem .4rem 1.15rem;
      background:linear-gradient(180deg,color-mix(in oklch,var(--app-accent) 26%,transparent),color-mix(in oklch,var(--app-accent) 17%,transparent))}
    .ph-who{font-family:var(--ms-mono,ui-monospace,monospace);font-size:var(--ms-label);
      color:color-mix(in oklch,var(--app-accent) 78%,var(--base-content,currentColor));opacity:.9;margin-bottom:.12rem}
    .ph-text{white-space:pre-wrap;word-break:break-word}
    .ph-meta{display:inline-flex;gap:.3rem;align-items:center;float:right;margin:.2rem 0 -.1rem .6rem;
      font-size:calc(var(--ms-label) * .92);opacity:.55;font-variant-numeric:tabular-nums}
    .ph-sys{align-self:center;font-size:var(--ms-label);opacity:.5;padding:.3rem 0}

    
    
    
    [data-near] > *:not(canvas){position:relative;z-index:1}
    .ph-field{position:relative;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center}
    .ph-sites{position:absolute;inset:0}
    .ph-site{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
      align-items:center;gap:.15rem;padding:.3rem;border-radius:.9rem;text-align:center;
      transition:transform .12s}
    .ph-site:active{transform:translate(-50%,-50%) scale(.93)}
    .ph-site-dot{width:.7rem;height:.7rem;border-radius:999px;background:var(--app-accent);
      box-shadow:0 0 .9rem color-mix(in oklch,var(--app-accent) 70%,transparent)}
    .ph-site-name{font-size:var(--ms-label);line-height:1.2;max-width:6rem;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
    .ph-site-id{font-family:var(--ms-mono,ui-monospace,monospace);font-size:calc(var(--ms-label) * .85);
      opacity:.5;letter-spacing:.05em}
    
    .ph-site-me .ph-site-dot{background:transparent;box-shadow:none;
      border:1px solid color-mix(in oklch,var(--base-content,currentColor) 45%,transparent)}
    .ph-site-me .ph-site-name{opacity:.55}
    .ph-field-note{position:relative;z-index:1;margin:0 0 .6rem;padding:0 1rem;text-align:center;
      font-size:var(--ms-label);line-height:1.4;
      color:color-mix(in oklch,var(--base-content,currentColor) 60%,transparent)}

    
    .ph-hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:1rem;text-align:center;padding:1.5rem}
    .ph-hero-glyph{display:grid;place-items:center;width:4.5rem;height:4.5rem;border-radius:999px;font-size:2rem;
      color:var(--app-accent);background:color-mix(in oklch,var(--app-accent) 12%,transparent);
      box-shadow:0 0 2.5rem color-mix(in oklch,var(--app-accent) 22%,transparent)}
    .ph-hero-text{max-width:17rem;line-height:1.5;color:color-mix(in oklch,var(--base-content,currentColor) 65%,transparent)}

    
    .ph-banner{display:flex;gap:.45rem;align-items:center;font-size:var(--ms-label);opacity:.85;
      padding:.4rem .7rem;border-radius:999px;align-self:center;
      background:color-mix(in oklch,var(--app-accent) 12%,transparent)}
    .ph-banner[data-fault="1"]{background:color-mix(in oklch,var(--color-warning,#d08700) 18%,transparent)}

    
    .ph-input{flex:1;min-width:0;background:transparent;border:0;outline:0;font:inherit;color:inherit;
      padding:.15rem .1rem;resize:none}
    .ph-input::placeholder{color:color-mix(in oklch,var(--base-content,currentColor) 45%,transparent)}
    .ph-send{flex:none;display:grid;place-items:center;width:var(--ms-ctl);height:var(--ms-ctl);
      border-radius:999px;background:var(--app-accent);color:#000;transition:opacity .15s,transform .1s}
    .ph-send:disabled{opacity:.3}
    .ph-send:active{transform:scale(.92)}

    
    .ph-peer{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;padding:.6rem .7rem;
      border-radius:var(--ms-r);background:color-mix(in oklch,var(--base-content,currentColor) 5%,transparent)}
    .ph-peer:active{background:color-mix(in oklch,var(--base-content,currentColor) 9%,transparent)}

    
    .ph-verdict{--vt:var(--color-success,var(--app-accent))}
    .ph-verdict[data-tone="warn"]{--vt:var(--color-warning,#d08700)}
    .ph-verdict[data-tone="err"]{--vt:var(--color-error,#e11d48)}
    .ph-verdict{border:1px solid color-mix(in oklch,var(--vt) 42%,transparent)}
    .ph-verdict > div > iconify-icon{color:var(--vt)}
    .ph-verdict-sub{font-size:var(--ms-label);line-height:1.45;margin-top:.15rem;
      color:color-mix(in oklch,var(--base-content,currentColor) 62%,transparent);word-break:break-word}

    
    [data-logs]{padding-bottom:calc(var(--dock-h) + 1.5rem)}
    
    .ph-logsec{display:flex;flex-direction:column;gap:.4rem;min-width:0}
    .ph-logh{font-family:var(--ms-mono,ui-monospace,monospace);font-size:var(--ms-label);
      letter-spacing:.08em;text-transform:uppercase;opacity:.55}
    .ph-logempty{font-size:var(--ms-label);opacity:.5}

    
    .ph-kv{display:grid;grid-template-columns:minmax(6rem,auto) 1fr;gap:.3rem .7rem;font-size:var(--ms-label)}
    .ph-kv dt{opacity:.55}
    .ph-kv dd{min-width:0;word-break:break-word;font-family:var(--ms-mono,ui-monospace,monospace)}
    .ph-perm{display:inline-block;margin:0 .3rem .25rem 0;padding:.1rem .4rem;border-radius:.4rem;
      background:color-mix(in oklch,var(--base-content,currentColor) 8%,transparent)}
    .ph-perm[data-held="0"]{background:color-mix(in oklch,var(--color-error,#e11d48) 20%,transparent)}
    .ph-capsraw{display:block;margin-top:.2rem;opacity:.5;word-break:break-all}
    
    .ph-pre{max-height:19rem;overflow:auto;padding:.6rem .7rem;border-radius:var(--ms-r);
      background:color-mix(in oklch,var(--base-content,currentColor) 6%,transparent);
      font-family:var(--ms-mono,ui-monospace,monospace);font-size:calc(var(--ms-label) * .95);
      line-height:1.5;white-space:pre;-webkit-user-select:text;user-select:text}</style>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Поголос</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>
  <script type="module">
    import spec from "./spec.json" with { type: "json" };
    import en from "./i18n/en.json" with { type: "json" };
    import uk from "./i18n/uk.json" with { type: "json" };
    import * as views from "./view.js";
    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
  </script>
</body>
</html>
