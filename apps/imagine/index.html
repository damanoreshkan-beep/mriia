<!DOCTYPE html>
<html lang="uk" data-theme="signal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Уяви</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <link href="/_rt/theme.css" rel="stylesheet" type="text/css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2",
      "lodash-es": "https://esm.sh/lodash-es@4.17.21",
      "three": "https://esm.sh/three@0.171.0",
      "three/addons/": "https://esm.sh/three@0.171.0/examples/jsm/",
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.20.1/dist/pixi.min.mjs",
      "pixi-filters": "https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.min.mjs",
      "d3-geo": "https://esm.sh/d3-geo@3",
      "topojson-client": "https://esm.sh/topojson-client@3",
      "@microspec/core/runtime/": "/_rt/"
    }
  }
  </script>
  <style>
    /* Over MEDIA only — a picture, the dust on black, a camera frame: foreign content the theme's tokens do
       not reach, so these are the one place a literal colour is right. The scrims keep the working line and
       the slide dots legible on a bright frame; the chip is a translucent black disc for the same reason. */
    .im-scrim-b{background:linear-gradient(to top,rgba(0,0,0,.7),transparent)}
    .im-scrim-t{background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent)}
    .im-chip{background:rgba(0,0,0,.55);color:#fff}
    /* the working light (rukh's rk-light): an accent filament along the stage's bottom edge whose LENGTH is
       the progress — the mark colour, never text */
    .im-light{position:absolute;left:0;bottom:0;height:2px;width:var(--pct,4%);background:var(--app-accent);box-shadow:0 0 8px var(--app-accent);transition:width var(--t-focal) var(--ease-out)}
    /* one more slide is still landing: the last dot breathes — a typographic pulse, never a spinner; it runs only
       while that slide is on its way */
    .im-more{animation:im-breathe 1.2s var(--ease-in-out) infinite}
    @keyframes im-breathe{0%,100%{opacity:.25}50%{opacity:.9}}

    /* THE PROMPT'S FORM (history.js): a remembered prompt seen as its own organic form (core shape.js, seeded by
       the words), the theme's texture through it and a rim of light on its edge — fonoteka's orb at row size. The
       pictures stay pictures: the stage is never clipped or decorated. */
    .im-forms{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
    .im-form{position:relative;flex:none;width:2.25rem;height:2.25rem}
    .im-form-fill{position:absolute;inset:0;background:var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat, var(--color-base-100)}
    .im-form-rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
    .im-form-rim path{fill:none;vector-effect:non-scaling-stroke;stroke:var(--lm-rim-hi);stroke-width:1.25;transition:stroke var(--t-press) var(--ease-out)}
    /* a touch lights the prompt's rim in the app's light (the press itself is .ms-press, the kit's 3% give) */
    .im-hist:active .im-form-rim path{stroke:var(--app-accent)}
    /* paper: the white rim would vanish on white — a faint ink edge; the lit edge is the deep pole, no glow */
    [data-theme="signal-light"] .im-form-rim path{stroke:color-mix(in oklch, var(--color-base-content) 22%, transparent)}
    [data-theme="signal-light"] .im-hist:active .im-form-rim path{stroke:var(--color-secondary)}
    @media(prefers-reduced-motion:reduce){.im-more{animation:none;opacity:.6}.im-light,.im-form-rim path{transition:none}}
  </style>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Уяви</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>
  <script type="module">
    import spec from "./spec.json" with { type: "json" };
    import en from "./i18n/en.json" with { type: "json" };
    import uk from "./i18n/uk.json" with { type: "json" };
    import * as views from "./view.js";
    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
  </script>
</body>
</html>
