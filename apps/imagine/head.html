  <style>
    /* Over MEDIA only — a picture, the dust on black, a camera frame: foreign content the theme's tokens do
       not reach, so these are the one place a literal colour is right. The scrims keep the working line and
       the slide dots legible on a bright frame; the chip is a translucent black disc for the same reason. */
    .im-scrim-b{background:linear-gradient(to top,rgba(0,0,0,.7),transparent)}
    .im-scrim-t{background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent)}
    .im-chip{background:rgba(0,0,0,.55);color:#fff}
    /* the working light (rukh's rk-light): an accent filament along the stage's bottom edge whose LENGTH is
       the progress — the mark colour, never text */
    .im-light{position:absolute;left:0;bottom:0;height:2px;width:var(--pct,4%);background:var(--app-accent);box-shadow:0 0 8px var(--app-accent);transition:width var(--t-focal) var(--ease-out)}
    /* one more slide is still landing: the last dot breathes — a typographic pulse, never a spinner; it runs only
       while that slide is on its way */
    .im-more{animation:im-breathe 1.2s var(--ease-in-out) infinite}
    @keyframes im-breathe{0%,100%{opacity:.25}50%{opacity:.9}}

    /* THE PROMPT'S FORM (history.js): a remembered prompt seen as its own organic form (core shape.js, seeded by
       the words), the theme's texture through it and a rim of light on its edge — fonoteka's orb at row size. The
       pictures stay pictures: the stage is never clipped or decorated. */
    .im-forms{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
    .im-form{position:relative;flex:none;width:2.25rem;height:2.25rem}
    .im-form-fill{position:absolute;inset:0;background:var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat, var(--color-base-100)}
    .im-form-rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
    .im-form-rim path{fill:none;vector-effect:non-scaling-stroke;stroke:var(--lm-rim-hi);stroke-width:1.25;transition:stroke var(--t-press) var(--ease-out)}
    /* a touch lights the prompt's rim in the app's light (the press itself is .ms-press, the kit's 3% give) */
    .im-hist:active .im-form-rim path{stroke:var(--app-accent)}
    /* paper: the white rim would vanish on white — a faint ink edge; the lit edge is the deep pole, no glow */
    [data-theme="signal-light"] .im-form-rim path{stroke:color-mix(in oklch, var(--color-base-content) 22%, transparent)}
    [data-theme="signal-light"] .im-hist:active .im-form-rim path{stroke:var(--color-secondary)}
    @media(prefers-reduced-motion:reduce){.im-more{animation:none;opacity:.6}.im-light,.im-form-rim path{transition:none}}
  </style>
