  <style>
    .ic-pane{background:color-mix(in srgb,var(--color-base-100) 85%,transparent);color:var(--color-base-content);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
    .ic-slot{background:color-mix(in srgb,var(--color-base-100) 90%,transparent);color:var(--color-base-content);box-shadow:0 0 0 1px var(--lm-rim, rgba(255,232,196,.11));transition:box-shadow var(--t-state) var(--ease-out),scale var(--t-press) var(--ease-out)}
    .ic-slot:hover{box-shadow:0 0 0 1px var(--lm-rim-hi, rgba(255,238,208,.2))}
    .ic-orb{position:relative;flex:none;display:grid;place-items:center;width:min(15rem,64vw,32dvh);aspect-ratio:1}
    .ic-orb-fill{position:absolute;inset:0;background:color-mix(in srgb,var(--color-base-100) 85%,transparent);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
    .ic-orb > :not(.ic-orb-fill):not(.ic-rim){position:relative}
    .ic-rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
    .ic-rim path{fill:none;vector-effect:non-scaling-stroke;transition:stroke var(--t-state) var(--ease-out),opacity var(--t-state) var(--ease-out)}
    .ic-rim .e{stroke:var(--lm-rim-hi, color-mix(in oklch,var(--color-base-content) 30%,transparent));stroke-width:1.25}
    .ic-rim .b1{stroke:var(--app-accent);stroke-width:12;opacity:0}
    .ic-rim .b2{stroke:var(--app-accent);stroke-width:4;opacity:0}
    
    .ic-orb[data-lit] .ic-rim .e{stroke:color-mix(in oklch,var(--app-accent) 85%,white)}
    .ic-orb[data-lit] .ic-rim .b1{opacity:.07}
    .ic-orb[data-lit] .ic-rim .b2{opacity:.22}
    
    [data-theme="signal-light"] .ic-rim .e{stroke:color-mix(in oklch,var(--color-base-content) 22%,transparent)}
    [data-theme="signal-light"] .ic-orb[data-lit] .ic-rim .e{stroke:var(--color-secondary);stroke-width:1.75}
    [data-theme="signal-light"] .ic-rim .b1,[data-theme="signal-light"] .ic-rim .b2{display:none}
    
    .ic-veil{background:color-mix(in srgb,var(--color-base-100) 90%,transparent);transition:background-color var(--t-focal) var(--ease-out)}
    .ic-veil[data-thin]{background:color-mix(in srgb,var(--color-base-100) 70%,transparent)}
    dialog[open] .ic-act{animation:ic-rise var(--t-move) var(--ease-out) both}
    @keyframes ic-rise{from{opacity:0;translate:0 12px}}
    
    .ic-glide{transition:x var(--t-state) var(--ease-out),width var(--t-state) var(--ease-out)}
    .ic-join{transition:opacity var(--t-press) var(--ease-out) var(--t-press)}
    .ic-mark{transition:opacity var(--t-state) var(--ease-out) var(--t-state)}
    
    .ic-chip{background:color-mix(in srgb,var(--color-base-100) 90%,transparent)}
    .ic-caret{display:inline-block;width:2px;height:1em;vertical-align:-.12em;background:var(--app-accent);animation:ic-blink 1s steps(2) infinite}
    @keyframes ic-blink{to{opacity:0}}
    
    .ic-line{height:1px;width:100%;background:linear-gradient(90deg,transparent,var(--app-accent),transparent);opacity:.6}
    @media(prefers-reduced-motion:reduce){.ic-caret{animation:none}.ic-veil,.ic-rim path{transition:none}dialog[open] .ic-act{animation:none}}
  </style>
