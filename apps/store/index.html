<!DOCTYPE html>
<html lang="uk" data-theme="signal">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Mriia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2",
      "lodash-es": "https://esm.sh/lodash-es@4.17.21",
      "three": "https://esm.sh/three@0.171.0",
      "three/addons/": "https://esm.sh/three@0.171.0/examples/jsm/",
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.20.1/dist/pixi.min.mjs",
      "pixi-filters": "https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.min.mjs",
      "d3-geo": "https://esm.sh/d3-geo@3",
      "topojson-client": "https://esm.sh/topojson-client@3",
      "@microspec/core/runtime/": "/_rt/"
    }
  }
  </script>
  <style>
    /* THE TODAY HERO answers its own width (owner 2026-09-02: "акуратненьку продуману навіть на горизонтальне
       положення, щоб не пуста була"): a container query on the card, never a viewport one — the card is what
       has a width. Narrow: the words and the orb. From 34rem of card (a phone in landscape, a tablet): the
       words grow into a display slogan and the orb grows with them, so the wide card is never empty. */
    .st-hero{container-type:inline-size}
    .st-hero-slogan{font-size:1.15rem;line-height:1.15;text-wrap:balance}
    /* Wide: the words fill the card up to the orb — no max-width and no auto margin, which left an empty
       middle between a short text column and a picture pushed to the far edge (the owner's phone, landscape). */
    @container (min-width:34rem){
      .st-hero-body{padding:1.1rem 1.35rem;gap:1.25rem}
      .st-hero-text{gap:.45rem}
      .st-hero-name{font-size:1.25rem}
      .st-hero-slogan{font-size:1.6rem;line-height:1.08;text-wrap:pretty}
    }
    /* FRESH ARRIVALS — a pager of slides, three cards each. A slide is the rail's width minus 2rem, so the
       next slide peeks in past the .75rem gap by 1.25rem: the hint that there is more, without an arrow. A
       lone slide takes the whole width. No wide variant: the page itself caps at ~34rem, and three wide
       cards in a stack read better there than three narrow ones in a row (eye, landscape 832px). */
    .st-slide{width:calc(100% - 2rem)}
    .st-slide:only-child{width:100%}
    /* The life light: a 2px filament down the card's left edge whose HEIGHT is the app's freshness (--life,
       1 = born today, .12 = the window's last day), lit in the accent. Colour as meaning, no badge. */
    .st-fresh-life{position:absolute;left:0;top:50%;width:2px;height:calc(var(--life,1) * 72%);transform:translateY(-50%);border-radius:1px;background:var(--app-accent);box-shadow:0 0 6px var(--app-accent)}
    .st-cat-glyph{color:var(--app-accent);font-size:1.05em;line-height:1;filter:drop-shadow(0 0 5px color-mix(in oklab, var(--app-accent) 60%, transparent))}

    /* FREE FORMS — the store wears Mriia's design (owner 2026-10-11: «одразу морду нашої Мрії зробити»), ON TOP
       of the launcher, never instead of it (2026-09-24): every app keeps its name, its icon and one tap; what
       changed is that the icon is seen through the app's own organic form (core shape.js) and edged with a rim,
       the way fonoteka's songs are. Energy: nothing here loops. The hero's form arrives once per visit (one
       morph, view.js HeroOrb); a press lights a rim; at rest the page draws nothing. The 2026-09-24 floating
       capture and pulsing tile rim were infinite loops, and are gone for that reason. */
    .st-forms{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
    .st-tile{position:relative;flex:none}
    /* the icon's own black is the ground inside the form, in both themes — the art is made on black */
    .st-tile-art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
    /* the rim: the same path as the clip, drawn over it so the light can sit ON the edge. On true black it is
       what draws a black icon's form at all; on paper the black form draws itself and the rim stays faint. */
    .st-rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
    .st-rim use{fill:none;stroke:var(--lm-rim-hi);stroke-width:1;transition:stroke var(--t-press) var(--ease-out)}
    [data-theme="signal-light"] .st-rim use{stroke:color-mix(in oklch, var(--color-base-content) 22%, transparent)}
    /* a touch lights the form's rim in the accent (the press itself is .ms-press, the kit's 3% give) */
    [data-app]:has(> button:active) .st-rim use, .st-fresh:active .st-rim use{stroke:var(--app-accent)}
    [data-theme="signal"] [data-app]:has(> button:active) .st-rim, [data-theme="signal"] .st-fresh:active .st-rim{filter:drop-shadow(0 0 4px var(--lm-bloom-hi))}
    [data-theme="signal-light"] [data-app]:has(> button:active) .st-rim use, [data-theme="signal-light"] .st-fresh:active .st-rim use{stroke:var(--color-secondary)}

    /* THE ORB — the lead app's art through its form, square, sized by the card (cqi of .st-hero). The rim is
       three strokes of the same path: a wide faint bloom, a narrow brighter one, a crisp edge — fonoteka's lit
       orb. Paper: a glow on white is a smear, so the edge is the deep pole and the bloom is dropped. */
    .st-orb{position:relative;flex:none;align-self:center;width:clamp(5.5rem,30cqi,7.25rem);aspect-ratio:1}
    @container (min-width:34rem){ .st-orb{width:clamp(8rem,28cqi,11rem)} }
    .st-orb-art{position:absolute;inset:0;background:#000}
    .st-orb-art img{display:block;width:100%;height:100%;object-fit:cover}
    .st-orb-rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
    .st-orb-rim path{fill:none;vector-effect:non-scaling-stroke}
    .st-orb-rim .e{stroke:color-mix(in oklch, var(--app-accent) 85%, white);stroke-width:1.25}
    .st-orb-rim .b1{stroke:var(--app-accent);stroke-width:12;opacity:.07}
    .st-orb-rim .b2{stroke:var(--app-accent);stroke-width:4;opacity:.22}
    [data-theme="signal-light"] .st-orb-rim .e{stroke:var(--color-secondary);stroke-width:1.75}
    [data-theme="signal-light"] .st-orb-rim .b1, [data-theme="signal-light"] .st-orb-rim .b2{display:none}
  </style>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Mriia</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>
  <script type="module">
    import spec from "./spec.json" with { type: "json" };
    import en from "./i18n/en.json" with { type: "json" };
    import uk from "./i18n/uk.json" with { type: "json" };
    import * as views from "./view.js";
    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
  </script>
</body>
</html>
