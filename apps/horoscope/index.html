  <style>
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>

  <style>
    /* HOROSCOPE on the motion-and-free-forms system (owner 2026-10-11: «розповсюджувати нову дизайн систему»).
       The SIGN is the identity: each of the twelve owns one organic form (core shape.js, pinned in view.js FORM),
       the chosen one is the ORB on the sign card — the theme's texture through the form, a rim of light, the
       sign's glyph on it — and it flows into the next sign's form when another is chosen. The reading and its
       ratings stay plain text: they are what is read. Energy: at rest nothing moves; a sign change is one morph. */

    /* THE ORB — square, inside the card's row; spans, not divs, since it lives in a <button> */
    .hs-orb { position: relative; display: block; flex: none; width: clamp(4.25rem, 21vw, 5.5rem); aspect-ratio: 1; }
    /* the theme's MATERIAL through the form (its fill texture, falling back to its scatter), over the page tone */
    .hs-fill { position: absolute; inset: 0; background: var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat, var(--color-base-100); }
    /* the rim: the same path as the clip, drawn in an SVG over it so the light can spill OUTSIDE the form. One
       bloom stroke, not fonoteka's two: at ~5rem a 12px bloom would swallow the form (persona's measure). The
       chosen sign is always lit — it is YOURS, as the store's lead app is. */
    .hs-rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .hs-rim path { fill: none; vector-effect: non-scaling-stroke; }
    .hs-rim .e { stroke: color-mix(in oklch, var(--app-accent) 85%, white); stroke-width: 1.25; }
    .hs-rim .b { stroke: var(--app-accent); stroke-width: 5; opacity: .22; }
    /* the glyph sits on the texture: a halo in the page tone keeps it legible over any theme's material */
    .hs-sign { position: absolute; inset: 25%; width: 50%; height: 50%; color: var(--app-accent); filter: drop-shadow(0 0 3px var(--color-base-100)); }
    /* paper: a glow on white is a smear — the rim and the glyph are the deep pole, no bloom */
    [data-theme="signal-light"] .hs-rim .e { stroke: var(--color-secondary); stroke-width: 1.75; }
    [data-theme="signal-light"] .hs-rim .b { display: none; }
    [data-theme="signal-light"] .hs-sign { color: var(--color-secondary); }

    /* A SIGN IN THE PICKER — its own form, small: an outline at rest, lit when it is the chosen one (fonoteka's
       song glyph), the sign's glyph on it; a touch lights the outline before the sheet closes. */
    .hs-mark { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; }
    .hs-mark > * { grid-area: 1 / 1; }
    .hs-form { width: 100%; height: 100%; overflow: visible; }
    .hs-form path { fill: transparent; stroke: color-mix(in oklch, var(--color-base-content) 38%, transparent); stroke-width: 1.25; vector-effect: non-scaling-stroke; transition: fill var(--t-state) var(--ease-out), stroke var(--t-state) var(--ease-out); }
    .hs-mark-sign { width: 1.5rem; height: 1.5rem; transition: color var(--t-state) var(--ease-out); }
    .hs-pick:active .hs-form path { stroke: var(--app-accent); }
    .hs-pick[aria-pressed="true"] .hs-form path { fill: var(--app-accent); stroke: var(--app-accent); }
    .hs-pick[aria-pressed="true"] .hs-mark-sign { color: var(--color-base-100); }
    [data-theme="signal"] .hs-pick[aria-pressed="true"] .hs-form { filter: drop-shadow(0 0 6px var(--lm-bloom-hi)); }
    [data-theme="signal-light"] .hs-pick:active .hs-form path { stroke: var(--color-secondary); }
    [data-theme="signal-light"] .hs-pick[aria-pressed="true"] .hs-form path { fill: var(--color-secondary); stroke: var(--color-secondary); }
    [data-theme="signal-light"] .hs-pick[aria-pressed="true"] .hs-mark-sign { color: var(--color-secondary-content); }
  </style>

<body class="bg-base-200 min-h-dvh">
