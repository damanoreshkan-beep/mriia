  <style>
    .vd-ring-on{color:var(--app-accent)}
    
    .vd-box{container-type:size}
    @container (max-width:300px){
      .vd-centre .vd-name{display:none}
      .vd-centre{gap:.25rem}
      .vd-centre .btn-lg{--size:calc(var(--size-field,.25rem) * 9)}
      .vd-centre .btn-lg iconify-icon{font-size:1.25rem}
    }
    
    @container (max-width:180px){
      .vd-centre [data-take-status]{display:none}
      .vd-centre{gap:.125rem}
    }
    
    .vd-root{container-type:size}
    @container (max-height:520px){
      .vd-words{height:1.7rem;min-height:1.7rem}
      .vd-card{width:2.75rem;padding:.125rem 0}
      .vd-card-pic{width:2.5rem;height:2.5rem}
      .vd-card-name{display:none}
      .vd-cards{padding-bottom:0}
      
      .vd-root .tp-form{width:3rem;height:3rem}
      .vd-root .tp-form>iconify-icon{font-size:1.5rem}
    }
    .vd-ring line{transition:opacity var(--t-state) var(--ease-out)}
    
    .vd-seal path{fill:currentColor;fill-opacity:0;stroke:currentColor;stroke-width:.005;stroke-opacity:.22;transition:fill-opacity var(--t-state) var(--ease-out),stroke-opacity var(--t-state) var(--ease-out)}
    .vd-ring-on .vd-seal path{fill-opacity:.07;stroke-opacity:.6}
    
    .vd-echo{position:relative;display:grid;place-items:center;width:2.75rem;height:2.75rem;flex:none;color:var(--color-primary-content)}
    .vd-echo>svg{position:absolute;inset:0;width:100%;height:100%}
    .vd-echo>svg path{fill:var(--color-primary);transition:fill var(--t-state) var(--ease-out)}
    .vd-echo>iconify-icon{position:relative}
    .vd-echo[data-on="true"]{color:var(--color-secondary-content)}
    .vd-echo[data-on="true"]>svg path{fill:var(--color-secondary)}
    .vd-echo:focus-visible{outline:2px solid var(--color-base-content);outline-offset:3px;border-radius:50%}
    
    .vd-cards{scrollbar-width:none;scroll-snap-type:x proximity}
    .vd-cards::-webkit-scrollbar{display:none}
    .vd-card{display:flex;flex-direction:column;align-items:center;gap:.25rem;width:4rem;padding:.25rem .125rem;border-radius:var(--ms-r-in);scroll-snap-align:start;transition:background-color var(--t-press) var(--ease-out),scale var(--t-press) var(--ease-out)}
    .vd-card-pic{width:3.5rem;height:3.5rem;border-radius:calc(var(--ms-r-in) - .125rem);background:#000;object-fit:cover;box-shadow:0 0 0 1px rgba(255,232,196,.14);color:var(--color-base-content);transition:box-shadow var(--t-state) var(--ease-out)}
    .vd-card-on .vd-card-pic{box-shadow:0 0 0 2px var(--app-accent),0 0 18px -4px var(--app-accent)}
    .vd-card-name{font-family:var(--font-mono);font-size:.6rem;line-height:1.1;text-transform:uppercase;letter-spacing:.04em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-base-content);opacity:.75}
    .vd-card-on .vd-card-name{opacity:1}
    
    .vd-st{animation:vd-stin var(--t-move) var(--ease-out)}
    @keyframes vd-stin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
    .vd-dots span{display:inline-block;animation:vd-dot 1.2s ease-in-out infinite;opacity:.2}
    .vd-dots span:nth-child(2){animation-delay:.2s}
    .vd-dots span:nth-child(3){animation-delay:.4s}
    @keyframes vd-dot{0%,100%{opacity:.2}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.vd-dots span{animation:none;opacity:.7}.vd-st{animation:none}.vd-seal path,.vd-echo>svg path,.vd-card,.vd-card-pic{transition:none}}
  </style>
