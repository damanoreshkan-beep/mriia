  <style>
    /* THE READING IS A FORM (owner 2026-10-11: «розповсюджувати нову дизайн систему»): the air here, now, sits in
       the place's own organic form (core shape.js), the theme's texture through it, a rim of light. The gauge is
       the DATA, so it is never inside the clip: it lies on top at 66% of the orb — the arc's outer edge at .30 of
       the box, inside the deepest valley of any organic form (Puffy, ~.33), so no form ever cuts the arc.
       Energy: at rest nothing moves; a new place is one ~320ms morph. */
    .air-orb{position:relative;width:min(13rem,100%);aspect-ratio:1}
    /* the centre is calm ground for the number and the arc; the texture lives in the ring between arc and rim */
    .air-fill{position:absolute;inset:0;background:radial-gradient(closest-side,var(--color-base-100) 60%,transparent 78%),var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat,var(--color-base-100)}
    /* the rim is the clip's path in an SVG over it, so the light can spill OUTSIDE the form; its bloom is the
       band's hue (--band, set inline) — the reading's colour, never a fixed accent */
    .air-rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
    .air-rim path{fill:none;vector-effect:non-scaling-stroke;transition:stroke var(--t-state) var(--ease-out)}
    .air-rim .e{stroke:var(--lm-rim-hi, color-mix(in oklch,var(--color-base-content) 30%,transparent));stroke-width:1.25}
    .air-rim .b1{stroke:var(--band);stroke-width:12;opacity:.08}
    .air-rim .b2{stroke:var(--band);stroke-width:4;opacity:.24}
    /* paper: a glow on white is a smear — a quiet edge, no bloom (the arc already carries the band) */
    [data-theme="signal-light"] .air-rim .e{stroke:color-mix(in oklch,var(--color-base-content) 22%,transparent)}
    [data-theme="signal-light"] .air-rim .b1,[data-theme="signal-light"] .air-rim .b2{display:none}
    .air-gauge{position:absolute;inset:17%;display:flex;align-items:center;justify-content:center}
    .air-gauge circle{transition:stroke var(--t-state) var(--ease-out)}
  </style>
