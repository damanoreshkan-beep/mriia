  <style>
    /* SYNESTHESIA — every note the camera hears is a FORM, not a circle (owner 2026-10-09: «досить будувати
       квадратики, потрібні форми довільні»). A note owns one of the farm's organic shapes (core shape.js, seeded
       by its name), filled with the colour that sounds it, its edge a rim of light that is lit while the chord
       plays. The stage is the camera's black in BOTH themes (paper never reaches it), so the colour's own glow
       stays. Energy: nothing loops — the 2s pulse the orbs wore while playing is gone; the lit rim says it. */
    .sy-orb { position: relative; display: grid; place-items: center; width: 4rem; height: 4rem; flex: none; }
    .sy-orb > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
      filter: drop-shadow(0 0 14px color-mix(in oklch, var(--sy-c) 70%, transparent)); }
    .sy-orb > span { position: relative; }
    .sy-orb .f { fill: var(--sy-c); }
    .sy-orb .e { fill: none; stroke: color-mix(in oklch, var(--sy-c) 40%, white); stroke-width: 1.25; vector-effect: non-scaling-stroke;
      opacity: .3; transition: opacity var(--t-state) var(--ease-out); }
    [data-playing="on"] .sy-orb .e { opacity: 1; }
  </style>
