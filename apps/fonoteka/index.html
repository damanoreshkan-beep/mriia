<!DOCTYPE html>
<html lang="uk" data-theme="signal">
<head>

  <title>Фонотека</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2",
      "lodash-es": "https://esm.sh/lodash-es@4.17.21",
      "three": "https://esm.sh/three@0.171.0",
      "three/addons/": "https://esm.sh/three@0.171.0/examples/jsm/",
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.20.1/dist/pixi.min.mjs",
      "pixi-filters": "https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.min.mjs",
      "d3-geo": "https://esm.sh/d3-geo@3",
      "topojson-client": "https://esm.sh/topojson-client@3",
      "@microspec/core/runtime/": "/_rt/"
    }
  }
  </script>
  <style>
    /* FONOTEKA — the song is a FORM, not a row in a box (owner 2026-10-09: «досить будувати квадратики,
       потрібні форми довільні»). Every song owns one of the farm's organic shapes (core shape.js, seeded by
       its id); the playing one is the ORB — the theme's own texture seen through that form, its edge a rim of
       light — and it flows into the next song's form when the song changes. No box, no card, no hairline.
       Energy: at rest the screen draws nothing; a morph is one-shot (~320ms of paint on one element); the
       orb's breath is a compositor `scale` track pinned to the audio clock (core breath.js). */

    /* THE ORB. Square, sized by whichever runs out first: width, height, or a ceiling. */
    .fk-orb { position: relative; width: min(15rem, 62vw, 32dvh); aspect-ratio: 1; margin-inline: auto; }
    /* the theme's MATERIAL through the form: its fill texture (1024, made to be seen inside a free form — a
       cluster of the material dissolving into the ground) over the page tone; each theme fills the same form
       with its own material, so the app needs no per-theme art. A theme without a fill falls back to its scatter. */
    .fk-fill { position: absolute; inset: 0; background: var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat, var(--color-base-100); }
    /* the rim: the same path as the clip, drawn in an SVG over it so the light can spill OUTSIDE the form */
    .fk-rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .fk-rim path { fill: none; vector-effect: non-scaling-stroke; transition: stroke var(--t-state) var(--ease-out), opacity var(--t-state) var(--ease-out); }
    .fk-rim .e { stroke: var(--lm-rim-hi); stroke-width: 1.25; }
    .fk-rim .b1 { stroke: var(--app-accent); stroke-width: 12; opacity: 0; }
    .fk-rim .b2 { stroke: var(--app-accent); stroke-width: 4; opacity: 0; }
    [data-playing="true"] .fk-rim .e { stroke: color-mix(in oklch, var(--app-accent) 85%, white); }
    [data-playing="true"] .fk-rim .b1 { opacity: .07; }
    [data-playing="true"] .fk-rim .b2 { opacity: .22; }
    /* paper: a glow on white is a smear — the playing rim is the deep pole, no bloom */
    [data-theme="signal-light"] .fk-rim .e { stroke: color-mix(in oklch, var(--color-base-content) 22%, transparent); }
    [data-theme="signal-light"] [data-playing="true"] .fk-rim .e { stroke: var(--color-secondary); stroke-width: 1.75; }
    [data-theme="signal-light"] .fk-rim .b1, [data-theme="signal-light"] .fk-rim .b2 { display: none; }

    /* The play button (a form that changes with the state) and the filament seek are the kit's —
       <Transport form>, core runtime.css .tp-form / .tp-filament. */

    /* the loop is ON («одна по колу»): the repeat-1 glyph in the app's light — the kit's lit state is the theme's
       primary, cream on black, which a phone does not tell from an unlit glyph */
    #repeat[aria-pressed="true"] { color: var(--app-accent); filter: drop-shadow(0 0 6px var(--lm-bloom-hi)); }
    [data-theme="signal-light"] #repeat[aria-pressed="true"] { color: var(--color-secondary); filter: none; }

    /* A SONG'S GLYPH — its own form, small: an outline at rest, lit when it is the one playing. */
    .fk-glyph { width: 1.75rem; height: 1.75rem; flex: none; overflow: visible; }
    .fk-glyph path { fill: none; stroke: color-mix(in oklch, var(--color-base-content) 38%, transparent); stroke-width: 1.25; vector-effect: non-scaling-stroke; transition: fill var(--t-state) var(--ease-out), stroke var(--t-state) var(--ease-out); }
    [aria-pressed="true"] .fk-glyph path, .fk-glyph.on path { fill: var(--app-accent); stroke: var(--app-accent); }
    [data-theme="signal"] [aria-pressed="true"] .fk-glyph, [data-theme="signal"] .fk-glyph.on { filter: drop-shadow(0 0 6px var(--lm-bloom-hi)); }
    [data-theme="signal-light"] [aria-pressed="true"] .fk-glyph path, [data-theme="signal-light"] .fk-glyph.on path { fill: var(--color-secondary); stroke: var(--color-secondary); }
    /* an upload fills its form with light from the bottom as the bytes go up */
    .fk-up { position: relative; width: 1.75rem; height: 1.75rem; flex: none; }
    .fk-up .fk-glyph { position: absolute; inset: 0; }
    .fk-up .fk-glyph.lit path { fill: var(--app-accent); stroke: var(--app-accent); }
    .fk-up .fk-glyph.lit { transition: clip-path var(--t-state) var(--ease-out); }
    [data-state="err"] .fk-glyph path { stroke: var(--color-error); }

    /* a new row arrives instead of appearing (entry only — a list re-render never replays it) */
    .fk-row { transition: opacity var(--t-state) var(--ease-out), translate var(--t-state) var(--ease-out); }
    @starting-style { .fk-row { opacity: 0; translate: 0 6px; } }

    /* THE ALBUMS (owner 2026-10-12: «альбомчики форми сіткою гарною, а не банальним списком»): a song is a tile —
       its cover, read from the file itself, inside the song's own form; a song with no picture shows the theme's
       material in the same form. The rim is the orb's, small: a hairline at rest, lit while the song is current. */
    .fk-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 40rem) { .fk-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .fk-album { position: relative; display: block; width: 100%; aspect-ratio: 1; }
    .fk-art { position: absolute; inset: 0; overflow: hidden;
      background: var(--ds-fill, var(--ds-scatter, none)) center / 140% auto no-repeat, var(--color-base-200); }
    .fk-art img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .fk-arim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .fk-arim path { fill: none; stroke: var(--lm-rim-hi); stroke-width: 1.25; vector-effect: non-scaling-stroke;
      transition: stroke var(--t-state) var(--ease-out); }
    [aria-pressed="true"] .fk-arim path { stroke: color-mix(in oklch, var(--app-accent) 85%, white); stroke-width: 2; }
    [data-theme="signal"] [aria-pressed="true"] .fk-arim { filter: drop-shadow(0 0 8px var(--lm-bloom-hi)); }
    [data-theme="signal-light"] .fk-arim path { stroke: color-mix(in oklch, var(--color-base-content) 22%, transparent); }
    [data-theme="signal-light"] [aria-pressed="true"] .fk-arim path { stroke: var(--color-secondary); }
    /* the current song's mark at the album's heart: what it is doing, on a disc of frosted page */
    .fk-now { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 2.75rem; height: 2.75rem; border-radius: 9999px;
      display: grid; place-items: center; color: var(--app-accent);
      background: color-mix(in oklch, var(--color-base-100) 72%, transparent); backdrop-filter: blur(6px); }
    [data-theme="signal-light"] .fk-now { color: var(--color-secondary); }

    /* the mini island is the kit's MiniPlayer (runtime.css .ms-mini) since 2026-10-11 */
    @media (prefers-reduced-motion: reduce) {
      .fk-row { transition: none; }
    }
  </style>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Фонотека</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>
  <script type="module">
    import spec from "./spec.json" with { type: "json" };
    import en from "./i18n/en.json" with { type: "json" };
    import uk from "./i18n/uk.json" with { type: "json" };
    import * as views from "./view.js";
    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
  </script>
</body>
</html>
