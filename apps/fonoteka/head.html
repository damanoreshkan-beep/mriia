  <style>
    /* FONOTEKA — the song is a FORM, not a row in a box (owner 2026-10-09: «досить будувати квадратики,
       потрібні форми довільні»). Every song owns one of the farm's organic shapes (core shape.js, seeded by
       its id); the playing one is the ORB — the theme's own texture seen through that form, its edge a rim of
       light — and it flows into the next song's form when the song changes. No box, no card, no hairline.
       Energy: at rest the screen draws nothing; a morph is one-shot (~320ms of paint on one element); the
       orb's breath is a compositor `scale` track pinned to the audio clock (core breath.js). */

    /* THE ORB. Square, sized by whichever runs out first: width, height, or a ceiling. */
    .fk-orb { position: relative; width: min(15rem, 62vw, 32dvh); aspect-ratio: 1; margin-inline: auto; }
    /* the theme's MATERIAL through the form: its fill texture (1024, made to be seen inside a free form — a
       cluster of the material dissolving into the ground) over the page tone; each theme fills the same form
       with its own material, so the app needs no per-theme art. A theme without a fill falls back to its scatter. */
    .fk-fill { position: absolute; inset: 0; background: var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat, var(--color-base-100); }
    /* the rim: the same path as the clip, drawn in an SVG over it so the light can spill OUTSIDE the form */
    .fk-rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .fk-rim path { fill: none; vector-effect: non-scaling-stroke; transition: stroke var(--t-state) var(--ease-out), opacity var(--t-state) var(--ease-out); }
    .fk-rim .e { stroke: var(--lm-rim-hi); stroke-width: 1.25; }
    .fk-rim .b1 { stroke: var(--app-accent); stroke-width: 12; opacity: 0; }
    .fk-rim .b2 { stroke: var(--app-accent); stroke-width: 4; opacity: 0; }
    [data-playing="true"] .fk-rim .e { stroke: color-mix(in oklch, var(--app-accent) 85%, white); }
    [data-playing="true"] .fk-rim .b1 { opacity: .07; }
    [data-playing="true"] .fk-rim .b2 { opacity: .22; }
    /* paper: a glow on white is a smear — the playing rim is the deep pole, no bloom */
    [data-theme="signal-light"] .fk-rim .e { stroke: color-mix(in oklch, var(--color-base-content) 22%, transparent); }
    [data-theme="signal-light"] [data-playing="true"] .fk-rim .e { stroke: var(--color-secondary); stroke-width: 1.75; }
    [data-theme="signal-light"] .fk-rim .b1, [data-theme="signal-light"] .fk-rim .b2 { display: none; }

    /* The play button (a form that changes with the state) and the filament seek are the kit's —
       <Transport form>, core runtime.css .tp-form / .tp-filament. */

    /* the loop is ON («одна по колу»): the repeat-1 glyph in the app's light — the kit's lit state is the theme's
       primary, cream on black, which a phone does not tell from an unlit glyph */
    #repeat[aria-pressed="true"] { color: var(--app-accent); filter: drop-shadow(0 0 6px var(--lm-bloom-hi)); }
    [data-theme="signal-light"] #repeat[aria-pressed="true"] { color: var(--color-secondary); filter: none; }

    /* A SONG'S GLYPH — its own form, small: an outline at rest, lit when it is the one playing. */
    .fk-glyph { width: 1.75rem; height: 1.75rem; flex: none; overflow: visible; }
    .fk-glyph path { fill: none; stroke: color-mix(in oklch, var(--color-base-content) 38%, transparent); stroke-width: 1.25; vector-effect: non-scaling-stroke; transition: fill var(--t-state) var(--ease-out), stroke var(--t-state) var(--ease-out); }
    [aria-pressed="true"] .fk-glyph path, .fk-glyph.on path { fill: var(--app-accent); stroke: var(--app-accent); }
    [data-theme="signal"] [aria-pressed="true"] .fk-glyph, [data-theme="signal"] .fk-glyph.on { filter: drop-shadow(0 0 6px var(--lm-bloom-hi)); }
    [data-theme="signal-light"] [aria-pressed="true"] .fk-glyph path, [data-theme="signal-light"] .fk-glyph.on path { fill: var(--color-secondary); stroke: var(--color-secondary); }
    /* an upload fills its form with light from the bottom as the bytes go up */
    .fk-up { position: relative; width: 1.75rem; height: 1.75rem; flex: none; }
    .fk-up .fk-glyph { position: absolute; inset: 0; }
    .fk-up .fk-glyph.lit path { fill: var(--app-accent); stroke: var(--app-accent); }
    .fk-up .fk-glyph.lit { transition: clip-path var(--t-state) var(--ease-out); }
    [data-state="err"] .fk-glyph path { stroke: var(--color-error); }

    /* a new row arrives instead of appearing (entry only — a list re-render never replays it) */
    .fk-row { transition: opacity var(--t-state) var(--ease-out), translate var(--t-state) var(--ease-out); }
    @starting-style { .fk-row { opacity: 0; translate: 0 6px; } }

    /* THE MINI ORB — the screen's ONLY island (owner 2026-10-10): when the player scrolls away, the playing song
       follows above the dock: a pill (a full round has no corner to reconcile), the song's glyph lit, its title,
       play/pause. Shown by an IntersectionObserver flipping one attribute; the move is one transition. */
    .fk-mini { position: fixed; z-index: 30; left: 50%; bottom: calc(var(--dock-h) + env(safe-area-inset-bottom) + .5rem);
      width: min(22rem, calc(100vw - 2rem)); translate: -50% .75rem; opacity: 0; pointer-events: none;
      transition: opacity var(--t-state) var(--ease-out), translate var(--t-state) var(--ease-out); }
    .fk-mini[data-show="true"] { translate: -50% 0; opacity: 1; pointer-events: auto; }
    @media (prefers-reduced-motion: reduce) {
      .fk-mini { translate: -50% 0; }
      .fk-row { transition: none; }
    }
  </style>
