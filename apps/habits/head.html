  <style>
    .hb-form { position: relative; display: grid; place-items: center; width: 2.5rem; height: 2.5rem; flex: none; color: var(--hb); }
    .hb-form > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .hb-form > svg path { fill: color-mix(in oklch, var(--hb) 14%, transparent); stroke: color-mix(in oklch, var(--hb) 45%, transparent);
      stroke-width: 1.25; vector-effect: non-scaling-stroke; transition: fill var(--t-state) var(--ease-out); }
    .hb-form > iconify-icon { position: relative; }
    [data-done="true"] .hb-form > svg path { fill: color-mix(in oklch, var(--hb) 28%, transparent); }

    
    
    .hb-orb { position: relative; width: 6.5rem; aspect-ratio: 1; margin: .5rem auto 0; flex: none; }
    .hb-defs { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }
    .hb-fill { position: absolute; inset: 0; clip-path: url(#hb-clip);
      background: var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat, var(--color-base-200); }
    .hb-rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .hb-rim path { fill: none; vector-effect: non-scaling-stroke; transition: stroke var(--t-state) var(--ease-out), opacity var(--t-state) var(--ease-out); }
    .hb-rim .e { stroke: var(--lm-rim-hi); stroke-width: 1.25; }
    
    .hb-rim .b1 { stroke: var(--hb); stroke-width: 12; opacity: 0; }
    .hb-rim .b2 { stroke: var(--hb); stroke-width: 4; opacity: 0; }
    [data-done="true"] .hb-rim .e { stroke: color-mix(in oklch, var(--hb) 85%, white); }
    [data-done="true"] .hb-rim .b1 { opacity: .07; }
    [data-done="true"] .hb-rim .b2 { opacity: .22; }
    
    [data-theme="signal-light"] .hb-rim .e { stroke: color-mix(in oklch, var(--color-base-content) 22%, transparent); }
    [data-theme="signal-light"] [data-done="true"] .hb-rim .e { stroke: var(--hb); stroke-width: 1.75; }
    [data-theme="signal-light"] .hb-rim .b1, [data-theme="signal-light"] .hb-rim .b2 { display: none; }

    .hb-check, .hb-cell { transition: scale var(--t-press) var(--ease-out), background-color var(--t-state) var(--ease-out), color var(--t-state) var(--ease-out); }
    .hb-pick { transition: scale var(--t-press) var(--ease-out), color var(--t-state) var(--ease-out), outline-color var(--t-state) var(--ease-out); }
    @media (prefers-reduced-motion: reduce) { .hb-form > svg path, .hb-rim path { transition: none; } }
  </style>
