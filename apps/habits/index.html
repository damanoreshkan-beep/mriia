  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2",
      "lodash-es": "https://esm.sh/lodash-es@4.17.21",
      "three": "https://esm.sh/three@0.171.0",
      "three/addons/": "https://esm.sh/three@0.171.0/examples/jsm/",
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.20.1/dist/pixi.min.mjs",
      "pixi-filters": "https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.min.mjs",
      "d3-geo": "https://esm.sh/d3-geo@3",
      "topojson-client": "https://esm.sh/topojson-client@3",
      "@microspec/core/runtime/": "/_rt/"
    }
  }

  <style>
    /* HABITS — onto the farm's free forms (owner 2026-10-11: «розповсюджувати нову дизайн систему»). The app's
       identity is the HABIT: a daily practice with its own icon and colour. In the list its badge is the habit's
       own form (core shape.js, pinned distinct per habit in view.js formsOf) where a rounded box stood, tinted in
       the habit's colour, a shade deeper once today is done. Its detail opens on the ORB — the theme's material
       through that form, the rim lit once today is done. The check-ins (today's key, the week, the 13-week
       grid) stay round keys and squares: they are the working surface. Static paths: at rest nothing draws. */
    .hb-form { position: relative; display: grid; place-items: center; width: 2.5rem; height: 2.5rem; flex: none; color: var(--hb); }
    .hb-form > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .hb-form > svg path { fill: color-mix(in oklch, var(--hb) 14%, transparent); stroke: color-mix(in oklch, var(--hb) 45%, transparent);
      stroke-width: 1.25; vector-effect: non-scaling-stroke; transition: fill var(--t-state) var(--ease-out); }
    .hb-form > iconify-icon { position: relative; }
    [data-done="true"] .hb-form > svg path { fill: color-mix(in oklch, var(--hb) 28%, transparent); }

    /* THE ORB — square, the theme's fill over the page tone, clipped by the habit's form (#hb-clip) */
    /* margin-top: the sheet body scrolls (overflow clips), so the bloom needs room above the first child */
    .hb-orb { position: relative; width: 6.5rem; aspect-ratio: 1; margin: .5rem auto 0; flex: none; }
    .hb-defs { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }
    .hb-fill { position: absolute; inset: 0; clip-path: url(#hb-clip);
      background: var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat, var(--color-base-200); }
    /* the rim: the same path drawn over the clip so the light can spill outside the form */
    .hb-rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .hb-rim path { fill: none; vector-effect: non-scaling-stroke; transition: stroke var(--t-state) var(--ease-out), opacity var(--t-state) var(--ease-out); }
    .hb-rim .e { stroke: var(--lm-rim-hi); stroke-width: 1.25; }
    /* lit in the HABIT's colour, not the app's: the heatmap below it and the check-in key are that colour */
    .hb-rim .b1 { stroke: var(--hb); stroke-width: 12; opacity: 0; }
    .hb-rim .b2 { stroke: var(--hb); stroke-width: 4; opacity: 0; }
    [data-done="true"] .hb-rim .e { stroke: color-mix(in oklch, var(--hb) 85%, white); }
    [data-done="true"] .hb-rim .b1 { opacity: .07; }
    [data-done="true"] .hb-rim .b2 { opacity: .22; }
    /* paper: a glow on white is a smear — the lit rim is the deep pole, no bloom */
    [data-theme="signal-light"] .hb-rim .e { stroke: color-mix(in oklch, var(--color-base-content) 22%, transparent); }
    [data-theme="signal-light"] [data-done="true"] .hb-rim .e { stroke: var(--hb); stroke-width: 1.75; }
    [data-theme="signal-light"] .hb-rim .b1, [data-theme="signal-light"] .hb-rim .b2 { display: none; }

    /* a check-in fills on the state clock and gives on the press clock (one transition list: .ms-press's own
       `transition: scale` would otherwise be overwritten by the colour's) */
    .hb-check, .hb-cell { transition: scale var(--t-press) var(--ease-out), background-color var(--t-state) var(--ease-out), color var(--t-state) var(--ease-out); }
    .hb-pick { transition: scale var(--t-press) var(--ease-out), color var(--t-state) var(--ease-out), outline-color var(--t-state) var(--ease-out); }
    @media (prefers-reduced-motion: reduce) { .hb-form > svg path, .hb-rim path { transition: none; } }
  </style>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Звички</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>

    import spec from "./spec.json" with { type: "json" };

    import uk from "./i18n/uk.json" with { type: "json" };

    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
