  <style>
    /* LAUNCHES on the motion-and-free-forms system (owner 2026-10-11: «розповсюджувати нову дизайн систему»). The
       app's object is a LAUNCH: in a list its picture is seen through the launch's own organic form (core shape.js,
       seeded by its id — the same launch, the same form, on the Earth tab and in the calendar), its edge a rim of
       light. A launch SITE wears its own form too, its country code on the form's ground. The globe, the calendar
       and the countdown are the working surface and wear no form. Energy: nothing loops; at rest nothing draws. */
    /* a zero-size svg, not display:none — a clipPath inside a display:none svg does not clip in every engine */
    .ln-defs { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }
    .ln-form { position: relative; flex: none; display: grid; place-items: center; }
    /* the form's ground is the inset face it replaces, so a missing picture still reads as a sunk well */
    .ln-ground { position: absolute; inset: 0; display: grid; place-items: center; background: var(--sf-inset-face, var(--color-base-300)); }
    /* the theme's material through the form, at a whisper (sigil's seal) — a picture covers it, and at full
       strength it would fight the site's code and the rocket glyph; none on a theme without a texture */
    .ln-ground::before { content: ""; position: absolute; inset: 0; background: var(--ds-fill, var(--ds-scatter, none)) center / 125% auto no-repeat; opacity: .35; }
    .ln-ground > * { position: relative; }
    .ln-ground img { width: 100%; height: 100%; object-fit: cover; }
    /* the site's code sits OVER the clip, never in it — a narrow-waisted form would cut the letters */
    .ln-code { position: relative; }
    /* the rim: the same path as the clip, drawn in an SVG over it so the light can sit ON the edge */
    .ln-rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .ln-rim path { fill: none; vector-effect: non-scaling-stroke; stroke: var(--lm-rim-hi); stroke-width: 1.25; transition: stroke var(--t-press) var(--ease-out); }
    /* a touch lights the rim (the press itself is .ms-press, the kit's 3% give); the open site is the chosen one,
       lit as a playing song's orb is — the same site the globe pulses */
    button:active > .ln-form .ln-rim path, [aria-expanded="true"] > .ln-form .ln-rim path { stroke: color-mix(in oklch, var(--app-accent) 85%, white); }
    [data-theme="signal"] [aria-expanded="true"] > .ln-form .ln-rim { filter: drop-shadow(0 0 4px var(--lm-bloom-hi)); }
    /* paper: the white rim highlight vanishes on white and a glow is a smear — the edge is ink, the lit edge the deep pole */
    [data-theme="signal-light"] .ln-rim path { stroke: color-mix(in oklch, var(--color-base-content) 22%, transparent); }
    [data-theme="signal-light"] button:active > .ln-form .ln-rim path,
    [data-theme="signal-light"] [aria-expanded="true"] > .ln-form .ln-rim path { stroke: var(--color-secondary); stroke-width: 1.75; }
  </style>
