  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2",
      "lodash-es": "https://esm.sh/lodash-es@4.17.21",
      "three": "https://esm.sh/three@0.171.0",
      "three/addons/": "https://esm.sh/three@0.171.0/examples/jsm/",
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.20.1/dist/pixi.min.mjs",
      "pixi-filters": "https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.min.mjs",
      "d3-geo": "https://esm.sh/d3-geo@3",
      "topojson-client": "https://esm.sh/topojson-client@3",
      "@microspec/core/runtime/": "/_rt/"
    }
  }
  </script>
  <style>
    /* THE FRAME — a well the light does not reach (sf-inset), the clip letterboxed on black inside it. The
       chooser island and the picture's controls sit over it; the island's frost needs the black to read. */
    .rk-frame{background:#000;outline:1px solid rgba(255,232,196,.16);outline-offset:-1px}
    /* chips ON the frame sit over a picture or a clip — a translucent black disc keeps them legible on both */
    .rk-chip{background:rgba(0,0,0,.55);color:#fff}
    /* the first-frame chip: the picture itself, a 40×54 rounded thumbnail with the lit rim */
    .rk-thumb{width:2.5rem;height:3.375rem;border-radius:var(--ms-r-in);background:#000;box-shadow:0 0 0 1px rgba(255,232,196,.35),0 0 12px -2px var(--app-accent)}
    /* the working light: a 2 px amber filament along the frame's bottom edge whose LENGTH is the progress */
    .rk-light{position:absolute;left:0;bottom:0;height:2px;width:var(--pct,4%);background:var(--app-accent);box-shadow:0 0 8px var(--app-accent);transition:width var(--t-focal) var(--ease-out)}
    /* RUKH — onto the farm's free forms (owner 2026-10-11: «розповсюджувати нову дизайн систему»). The app's
       identity is the CLIP: a few seconds of film from words or a picture. The frame and the storyboard stay
       rectangles — film is a rectangle, and the frame is the picture itself. A kept clip's play key in the
       collection is the clip's own form (core shape.js, seeded by its id) where a circle stood: ink at rest,
       the secondary while that clip is the one on the stage. A static path: nothing draws at rest. */
    .rk-take{position:relative;display:grid;place-items:center;width:2.75rem;height:2.75rem;flex:none;color:var(--color-primary-content)}
    .rk-take > svg{position:absolute;inset:0;width:100%;height:100%}
    .rk-take > svg path{fill:var(--color-primary);transition:fill var(--t-state) var(--ease-out)}
    .rk-take > iconify-icon{position:relative}
    .rk-take[data-on="true"]{color:var(--color-secondary-content)}
    .rk-take[data-on="true"] > svg path{fill:var(--color-secondary)}
    .rk-take:focus-visible{outline:2px solid var(--color-base-content);outline-offset:3px;border-radius:50%}
    /* THE SPLIT REGIME — the runtime turns the view into a row under 520 px of height (.ms-side, runtime.css);
       the view root is a size container so the island follows the same threshold WITHOUT an app-local media
       query: one-line words, the transport stays (it compacts on width itself). */
    .rk-root{container-type:size}
    @container (max-height:520px){
      .rk-words{height:1.7rem;min-height:1.7rem;line-height:1.7rem;padding:0;overflow:hidden}
      /* the transport keeps its BUTTON row (play · share · save · clips) and demotes its now-playing block and
         seek bar — 216 px of view at 360×340 hold words + rail + buttons + verb, not a title and a seek bar too
         (eye 2026-09-03: the island ran under the header and into the dock); the overflow dialog stays */
      .rk-root [data-transport] > div:not([data-tp-row]){display:none}
      .rk-root [data-models]{margin-top:-.125rem}
      .rk-root .rk-res{display:none}
      /* the free-form play key is 68 px; the split budget above was measured with the 48 px key, so it keeps 48 */
      .rk-root #play.tp-form{width:3rem;height:3rem}
    }
    /* the working state breathes through three staggered dots — a typographic pulse, never a spinner */
    .rk-st{animation:rk-stin var(--t-move) var(--ease-out)}
    @keyframes rk-stin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
    .rk-dots span{display:inline-block;animation:rk-dot 1.2s ease-in-out infinite;opacity:.2}
    .rk-dots span:nth-child(2){animation-delay:.2s}
    .rk-dots span:nth-child(3){animation-delay:.4s}
    @keyframes rk-dot{0%,100%{opacity:.2}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.rk-dots span{animation:none;opacity:.7}.rk-st{animation:none}}
  </style>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Рух</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>
  <script type="module">
    import spec from "./spec.json" with { type: "json" };
    import en from "./i18n/en.json" with { type: "json" };
    import uk from "./i18n/uk.json" with { type: "json" };
    import * as views from "./view.js";
    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
  </script>
