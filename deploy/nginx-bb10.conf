# BB10-lite UA routing — dreamstudio.mooo.com host nginx (VPS, Certbot-managed, NOT git-tracked anywhere
# today: /etc/nginx/sites-enabled/dreamstudio). Recipe + root cause: docs/research/bb10-lite.md.
#
# This is a snippet to hand-merge into the EXISTING server{} block, ahead of its generic `location /` /
# proxy_pass to the containerized web service (127.0.0.1:8090, which serves /srv/www — the deployed dist/
# mirror, dist/lite/ included). It is NOT applied automatically by any deploy script (same as the rest of
# that Certbot-managed file) — a human runs `nginx -t && systemctl reload nginx` after merging it in.
#
# The `if` below only ever does a bare `return` / `rewrite ... last` — the one usage nginx's own docs
# consider safe despite the general "if is evil" warning.

map $http_user_agent $ms_legacy {
    default   0;
    ~*BB10    1;
    ~*QNX     1;
}

server {
    # ... existing directives (listen 443 ssl; server_name dreamstudio.mooo.com; ssl_certificate ...; ) ...

    # Legacy UA hitting the front door goes straight to the pre-rendered, zero-JS list instead of the real
    # store shell (which white-screens: <script type="module">, ES2017+ syntax, CSS var() — see the doc).
    location = / {
        if ($ms_legacy) { return 302 /lite/; }
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # Legacy UA tapping into any single app (/<id>/) gets the one shared fallback notice instead of that
    # app's own JS-only page (which would white-screen identically) — matched AFTER `location = /` and
    # BEFORE the generic `location /` this replaces.
    location ~ ^/([a-z0-9-]+)/$ {
        if ($ms_legacy) { rewrite ^ /lite/app-fallback.html last; }
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # ... existing generic `location /` (proxy_pass http://127.0.0.1:8090; ...) and `/feed/*` block unchanged ...
}
